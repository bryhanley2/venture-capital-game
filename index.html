  const priceNow=c.owned?c.entryCap||c.post:(c.terms?capNow(c)||capAt(c,c.week):c.post);
  const arrNow=F.arr?M.arr:c.deck.arr, priceMult=arrNow>0?priceNow/arrNow:0;
  const bm=burnMultiple(c);
  const otherKeys=Object.keys(F).filter(k=>!INLINE_FACTS.includes(k));
  return `
    <div class="pitch-cols">
    <div class="pcol">
    <section class="dsec"><h4>The round</h4><dl>
      ${row('Stage',STAGES[c.stage])}
      ${row('Raising',fmt$(c.round))}
      ${row(c.stage<2?'Post-money cap':'Post-money valuation',`${fmt$(priceNow)}${c.owned?' <span class="tag n">yours</span>':''}`,c.stage<2?'The SAFE’s post-money valuation cap: the price your money converts at. Your ownership = check ÷ cap. A lower cap means more of the company for the same check.':'Post-money valuation: the company’s price including the new money. Your ownership = check ÷ post-money.')}
      ${row('Price ÷ revenue',priceMult?Math.round(priceMult)+'x':'—','Post-money valuation divided by annual recurring revenue. Higher means you pay more for each dollar of revenue.')}
      ${row('Investor demand',F.interest?esc(F.interest[1]):ask)}
      ${row('Round closes',c.terms&&!c.owned?(roundClosed(c)?'<span class="ask">closed</span>':closeWeek(c)===Infinity?'<span class="ask">open, no deadline</span>':`week ${closeWeek(c)}`):'—','How long the round stays open. Each diligence call takes about two weeks.')}
      ${row('Lead investor',c.lead?`${FUND_BY[c.lead].short} <span class="tag n">${relTier(G.rel[c.lead]).toLowerCase()}</span>`:'<span class="ask">none yet</span>','The fund setting terms for this round. Your relationship with the lead decides whether you get room in a hot round. See the Network tab.')}
    </dl>${c.terms&&!c.owned?termsLadder(c):''}</section>
    <section class="dsec"><h4>Team</h4>
      <p class="founder"><b>${esc(c.founder)}</b>, CEO · ${esc(c.bg)}</p>
      <dl>${row('References',F.refs?esc(F.refs[1]):ask)}</dl></section>
    </div><div class="pcol">
    <section class="dsec"><h4>Traction</h4><dl>
      ${row('Revenue (ARR)',arrVal,'Annual recurring revenue. Figures tagged “deck” come from the pitch and are unverified until you ask on a call.')}
      ${row('Growth',grVal,'Year-over-year revenue growth.')}
      ${row('Signed LOIs / pilots',F.lois?esc(F.lois[1]):ask)}
      ${row('Net retention',F.nrr?esc(F.nrr[1]):ask,'Net revenue retention: revenue kept from last year’s customers, including upsells. Over 100% means customers expand.')}
    </dl></section>
    <section class="dsec"><h4>Metrics</h4><dl>
      ${row('Monthly burn',F.burn?esc(F.burn[1]):ask)}
      ${row('Runway',F.cash?`${M.runwayMo} months`:ask,'Months until the company runs out of cash at its current burn.')}
      ${row('Gross margin',F.gm?esc(F.gm[1]):ask)}
      ${row('Burn multiple',bm==null?'<span class="ask">ask burn, ARR, growth</span>':bm===Infinity?'n/a':`${bm.toFixed(1)}x ${bm<1.5?'· efficient':bm>3?'· inefficient':'· ok'}`,'Cash burned for each $1 of new revenue added. Under 1.5x is efficient; over 3x is a warning.')}
    </dl></section>
    </div></div>
    ${otherKeys.length?`<div class="facts">${otherKeys.map(k=>`<div><small>${F[k][0]}</small><span>${esc(F[k][1])}</span></div>`).join('')}</div>`:''}
    ${c.flagsSeen.length?`<div class="flags">${c.flagsSeen.map(f=>`<div class="flag ${f.level==='warn'?'warn':''}"><b>${f.level==='warn'?'Watch:':'Red flag:'}</b> ${esc(f.text)}</div>`).join('')}</div>`:''}
    <details class="scores"><summary>Pitch scores <span class="muted">· the founder's self-rating</span></summary>
      <div class="meters">${FKEYS.map(k=>meter(c,k)).join('')}</div></details>`;
}

// ---------------------------------------------------------------------------
// Pitch day: the quarter opens in the lobby, founders pitch one at a time,
// and each decision gets stamped on the memo before the next founder walks in.
// ---------------------------------------------------------------------------
const initials=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2);
const undecided=c=>!c.owned&&!c.pitch;
const referTarget=c=>{ const f=FUNDS.find(f=>f.refers&&f.leads.includes(c.stage)); return f&&f.id!==c.lead?f:null; };
function reaction(c,kind,extra){
  const pickQ=a=>a[hashStr(c.name+kind)%a.length];
  const t={fund:['Thrilled to have you in. Let\u2019s build this.','You won\u2019t regret it. First board update is coming your way.','Done. Wiring instructions are in your inbox.'],
    pass:c.calls>=2?['We spent a lot of time on this. Wish we\u2019d heard no sooner.','That\u2019s a lot of calls for a no.']:c.calls===1?['Thanks for digging in. We\u2019ll prove you wrong.','Fair enough. We\u2019ll send you the Series A deck.']:['Understood. We\u2019ll keep you posted.','No problem. Maybe next round.'],
    refer:[`Thanks for the intro to ${extra}. That\u2019s generous of you.`,`An intro to ${extra}? We owe you one.`],
    lost:[`Sorry. ${extra} moved faster and we signed with them.`,`We needed an answer today. ${extra} gave us one.`]}[kind];
  return {who:c.founder.split(' ')[0], co:c.name, ini:initials(c.founder), text:pickQ(t), kind};
}
function opener(c){
  const first=c.founder.split(' ')[0], ol=c.oneLiner, what=/^[A-Z]{2}/.test(ol)?ol:ol[0].toLowerCase()+ol.slice(1);
  const arr=c.deck.arr, g=Math.round(c.deck.growth);
  const trend=g<0?`down ${-g}% from last year while we reposition`:g<15?`roughly flat over the last year`:`up ${g}% over the last year`;
  const traction=arr<80e3?`We're early: ${fmt$(arr)} in revenue, mostly paid pilots${g>=15?`, and growing ${g}% a year`:''}.`:`We're at ${fmt$(arr)} in annual recurring revenue, ${trend}.`;
  const hook=c.bg.includes('prior exit')?'I’ve built and sold a company before, and this one is bigger. ':c.bg.includes('straight out of school')?'We’re young, but nobody will outwork us. ':'';
  return `Hi, I'm ${first}. At ${c.name}, we're building ${what}. ${hook}${traction} We're raising ${fmt$(c.round)} at ${fmt$(c.post)} post-money.`;
}
function pitchCard(c,i,n,ghost){
  const thesis=c.sector===G.thesis;
  const acts=c.owned?`<span class="owned-note">You invested ${fmt$(c.invested)} for ${pct(c.own)}</span>`
    :c.pitch==='lost'?`<span class="owned-note lostnote">The round closed without you.</span><button class="primary" data-act="nextPitch">Next founder</button>`
    :c.pitch==='waiting'?`<span class="owned-note">You're waiting to see if the price comes down next quarter.</span><button class="primary" data-act="nextPitch">Next founder</button>`:`
      <button class="act-pass" data-act="passDeal" data-id="${c.id}"><span>Pass</span><kbd>P</kbd></button>
      ${referTarget(c)?`<button class="act-ref" data-act="passDeal" data-id="${c.id}" data-ref="${referTarget(c).id}" title="Pass, and send the deal to ${referTarget(c).name}. Builds the relationship, and more if the company does well."><span>Pass &amp; refer to ${referTarget(c).short}</span><kbd>R</kbd></button>`:''}
      <button class="act-call" data-act="openCall" data-id="${c.id}" ${G.calls<=0||c.asked.length>=QUESTIONS.length?'disabled':''}><span>Diligence call · ${G.calls} left</span><kbd>D</kbd></button>
      <button class="primary act-inv" data-act="openInvest" data-id="${c.id}" ${G.cash<=0?'disabled':''}><span>Invest</span><kbd>I</kbd></button>`;
  const hot=hotRound(c)&&!c.owned&&!c.pitch&&!roundClosed(c), refBy=c.referredBy==='founder'?`Intro from ${esc(c.referrer)}`:c.referredBy?`Referred by ${FUND_BY[c.referredBy].short}`:'';
  const banner=!hot?'':isExploding(c)
    ?`<div class="hotbar explode"><b>Hot round, filling fast.</b> ${c.lead?FUND_BY[c.lead].name+' is leading and':'Several funds are'} circling. The cap steps up every two weeks and the round closes at week 4. Each diligence call costs you two weeks.</div>`
    :`<div class="hotbar access"><b>Hot round, and you're in.</b> ${c.lead&&G.rel[c.lead]>=60?`${FUND_BY[c.lead].name} is holding your allocation at the first-close cap because you're ${relTier(G.rel[c.lead]).toLowerCase()}.`:'Your reputation with founders got you held at the first-close cap.'} The round stays open until week 6.</div>`;
  const vb=c.owned||c.pitch?'':(referTarget(c)?'four':'');
  return `<article class="card pitch ${ghost?'pitch-ghost':''} ${c.owned?'is-owned':''}" ${ghost?'aria-hidden="true" inert':''}>
    <header class="pitch-h">
      <div class="avatar" aria-hidden="true">${esc(initials(c.founder))}</div>
      <div class="pitch-who"><h3>${esc(c.name)}</h3><small>${esc(c.founder)} · ${c.sector} · ${c.model}</small></div>
      <div class="chips">${refBy?`<span class="chip chip-good">${refBy}</span>`:''}${thesis?'<span class="chip chip-acc">In thesis</span>':''}${c.pitch==='passed'?'<span class="chip chip-bad">You passed</span>':''}<span class="chip">Pitch ${i+1} of ${n}</span></div>
    </header>
    ${banner}
    <blockquote class="opener">“${esc(opener(c))}”</blockquote>
    ${dealBody(c)}
    <footer class="verdict-bar ${vb}">${acts}</footer>
    ${ghost?`<div class="stamp ${ghost==='fund'?'fund':'pass'}">${ghost==='fund'?`Funded<small>${fmt$(c.invested)}</small>`:ghost==='lost'?`Lost<small>to ${c.lead?FUND_BY[c.lead].short:'a rival'}</small>`:`Passed${c.referredTo?`<small>referred to ${FUND_BY[c.referredTo].short}</small>`:''}`}</div>`:''}
  </article>`;
}
function lineup(){
  return `<div class="lineup" role="tablist" aria-label="This quarter's founders">${G.deals.map((id,i)=>{const c=byId(id);
    const st=c.owned?'funded':c.pitch==='passed'?'passed':c.pitch==='lost'?'lost':c.pitch==='waiting'?'wait':G.stage==='pitch'&&i===G.pitch?'now':'waiting';
    const lbl={funded:'Funded',passed:'Passed',lost:'Round closed',wait:'Waiting on price',now:'Pitching',waiting:hotRound(c)&&!hasAccess(c)?'Hot · waiting':'Waiting'}[st];
    return `<button class="lu lu-${st}" role="tab" aria-selected="${st==='now'}" data-act="gotoPitch" data-i="${i}"><span class="avatar sm" aria-hidden="true">${esc(initials(c.founder))}</span><span class="lu-t"><b>${esc(c.name)}</b><small>${lbl}</small></span></button>`;}).join('')}</div>`;
}
function renderDeals(){
  if(G.q>=INVEST_QS) return `<div class="card empty"><h3>The investment period is over</h3><p>No new deals after Year ${INVEST_QS/4}. Your job now is the portfolio: follow-ons, bridges and founder support. You have ${fmt$(G.cash)} in reserves.</p></div>`;
  const deployed=G.investable-G.cash, fx=G.fx, n=G.deals.length;
  if(G.stage==='intro'){
    const active=G.shocks.filter(x=>x.from<=G.q&&G.q<x.until);
    return `<section class="lobby ${fx&&fx.t==='intro'?'fx-intro':''}">
      <p class="eyebrow">Year ${Math.floor(G.q/4)+1} · Quarter ${G.q%4+1}</p>
      <h2>${n} founders are in the lobby</h2>
      ${G.deals.some(id=>byId(id).referredBy)?`<p class="lobby-ref">${G.deals.map(byId).filter(c=>c.referredBy).map(c=>c.referredBy==='founder'?`${esc(c.referrer)} sent you ${esc(c.name)}.`:`${FUND_BY[c.referredBy].name} invited you into ${esc(c.name)}.`).join(' ')}</p>`:''}
      <p class="lobby-mkt"><span class="reg reg-${G.regime}">${REGIMES[G.regime].label} market</span> · Fed funds ${G.rate.toFixed(2)}%${active.map(x=>` · <span class="chip ${x.mag>0?'chip-good':'chip-bad'}">${x.sector}</span> ${esc(x.text)}`).join('')}</p>
      <div class="lobby-cards">${G.deals.map((id,i)=>{const c=byId(id);return `<div class="lcard ${c.referredBy?'ref':''}" style="--d:${i}"><span class="avatar" aria-hidden="true">${esc(initials(c.founder))}</span><b>${esc(c.name)}</b><small>${c.sector} · ${STAGES[c.stage]}${c.referredBy?` · ${c.referredBy==='founder'?'founder intro':'via '+FUND_BY[c.referredBy].short}`:''}${hotRound(c)?' · hot round':''}</small><span class="num">raising ${fmt$(c.round)}</span></div>`}).join('')}</div>
      <p class="lobby-res">Founder reputation ${Math.round(G.rep)} · ${REP_TIER(G.rep)}</p>
      <p class="lobby-res">${fmt$(G.cash)} dry powder (${pct(deployed/G.investable,0)} deployed) · ${G.calls} diligence calls left for the fund · ${G.hours} partner hours this quarter</p>
      <div class="row"><button class="primary big" data-act="startPitches">Bring in the first founder <kbd>Enter</kbd></button>
        ${G.pending.length||G.companies.some(c=>c.owned&&c.status==='alive'&&c.crisis)?`<button data-act="tab" data-k="port">Portfolio needs you first</button>`:''}</div>
    </section>`;
  }
  const ghostC=fx&&(fx.t==='pass'||fx.t==='fund'||fx.t==='lost')?byId(fx.id):null, ghostI=ghostC?G.deals.indexOf(ghostC.id):0;
  const ghost=ghostC?pitchCard(ghostC,ghostI,n,fx.t):'';
  const toast=G.toast?`<div class="toast ${G.toast.kind}" role="status"><span class="avatar sm" aria-hidden="true">${esc(G.toast.ini)}</span><span><b>${esc(G.toast.who)}, ${esc(G.toast.co)}:</b> \u201c${esc(G.toast.text)}\u201d</span></div>`:'';
  if(G.stage==='done'){
    const funded=G.deals.map(byId).filter(c=>c.owned), passed=G.deals.map(byId).filter(c=>!c.owned&&c.pitch!=='lost'&&c.pitch!=='waiting'), lost=G.deals.map(byId).filter(c=>c.pitch==='lost');
    const needs=G.pending.length+G.companies.filter(c=>c.owned&&c.status==='alive'&&c.crisis).length;
    return `${lineup()}${toast}<div class="stage">${ghost}<section class="card wrapup ${fx?'enter':''}">
      <p class="eyebrow">Pitch day is over</p><h2>${funded.length?`You backed ${funded.length} of ${n}`:'You passed on everyone'}</h2>
      ${funded.length?`<p>${funded.map(c=>`<b>${esc(c.name)}</b> · ${fmt$(c.invested)} for ${pct(c.own)}`).join('<br>')}</p>`:''}
      ${passed.length?`<p class="muted">Passed: ${passed.map(c=>esc(c.name)+(c.referredTo?` (referred to ${FUND_BY[c.referredTo].short})`:'')).join(', ')}</p>`:''}
      ${lost.length?`<p class="muted">Rounds that closed without you: ${lost.map(c=>esc(c.name)).join(', ')}</p>`:''}
      ${G.deals.map(byId).filter(c=>c.pitch==='waiting').length?`<p class="muted">Waiting on price: ${G.deals.map(byId).filter(c=>c.pitch==='waiting').map(c=>esc(c.name)).join(', ')}</p>`:''}
      <p class="muted" style="font-size:.85rem">${fmt$(G.cash)} dry powder left. Most seed funds hold back 40–60% for follow-ons.</p>
      <div class="row">${needs?`<button data-act="tab" data-k="port">Portfolio · ${needs} need${needs>1?'':'s'} you</button>`:''}<button class="primary big" data-act="end">End the quarter</button></div>
    </section></div>`;
  }
  const c=byId(G.deals[G.pitch]);
  return `${lineup()}${toast}<div class="stage">${ghost}<div class="${fx?'enter':''}">${pitchCard(c,G.pitch,n,false)}</div></div>
    <p class="legend-line"><span class="tag">deck</span> unverified pitch number · <i>ask</i> only known after a diligence call · dotted labels have definitions on hover</p>`;
}
function advancePitch(){
  const n=G.deals.length;
  for(let k=1;k<=n;k++){ const j=(G.pitch+k)%n; if(undecided(byId(G.deals[j]))){ G.pitch=j; return; } }
  G.stage='done';
}
function startQuarterUI(){ if(!G||G.over) return; G.stage='intro'; G.pitch=0; G.fx={t:'intro'}; G.tab=G.q<INVEST_QS?'deals':'port'; }

function decisionCard(p){
  const c=byId(p.cid); const [ml]=momentumLabel(c);
  if(p.type==='offer'){
    const first=c.founder.split(' ')[0];
    return `<article class="card decision offer"><div><p class="eyebrow">Acquisition offer · board vote</p><h3>A buyer wants ${esc(c.name)}</h3></div>
      <p>The offer is <b>${fmt$(p.val)}</b>, ${(p.val/c.post).toFixed(1)}x the last round's ${fmt$(c.post)} post-money. Your stake would return <b>${fmt$(p.x*c.invested)}</b> on ${fmt$(c.invested)} invested (${fmtX(p.x)}). Momentum: ${ml}.</p>
      <p class="muted" style="font-size:.85rem">${p.founderSells?`${esc(first)} wants to take it. Pushing to hold out will cost you with founders, and a team that wanted to sell loses momentum.`:`${esc(first)} thinks there's more to build. Turning a buyer away costs some momentum, but a breakout could be worth far more.`} If you don't vote, the board accepts.</p>
      <div class="row"><button class="primary" data-act="decide" data-p="${p.pid}" data-c="accept">Support the sale · ${fmt$(p.x*c.invested)}</button>
      <button data-act="decide" data-p="${p.pid}" data-c="decline">Push to hold out</button></div></article>`;
  }
  if(p.type==='prorata'){
    const full=Math.min(p.amount,G.cash);
    return `<article class="card decision"><div><p class="eyebrow">Pro-rata offer</p><h3>${esc(c.name)} raised a ${STAGES[c.stage]}</h3></div>
      <p>New round of ${fmt$(p.round)} at ${fmt$(c.post)} post, ${p.step>=1?`a ${p.step.toFixed(1)}x step-up`:'<b>a down round</b>'}. Momentum: ${ml}. Your stake was diluted from ${pct(p.ownPre)} to ${pct(c.own)}. Your full pro-rata is ${fmt$(p.amount)} to hold ${pct(p.ownPre)}.</p>
      ${p.ownPre>=0.08?'<p class="muted" style="font-size:.85rem">You are a major holder. Passing will be noticed by other investors.</p>':''}
      <div class="row"><button class="primary" data-act="decide" data-p="${p.pid}" data-c="full" ${full<=0?'disabled':''}>Full pro-rata · ${fmt$(full)}</button>
      <button data-act="decide" data-p="${p.pid}" data-c="half" ${G.cash<=0?'disabled':''}>Half · ${fmt$(Math.min(p.amount/2,G.cash))}</button>
      <button class="ghost" data-act="decide" data-p="${p.pid}" data-c="pass">Pass</button></div></article>`;
  }
  return `<article class="card decision bridge"><div><p class="eyebrow">Bridge request</p><h3>${esc(c.name)} could not close its next round</h3></div>
    <p>Insiders are asked for a ${fmt$(p.total)} bridge at the last price to buy about nine months. Your share is ${fmt$(p.amount)}. Without it, the company will most likely shut down or sell for parts. You own ${pct(c.own)} and have ${fmt$(c.invested)} in.</p>
    ${(()=>{const pOk=sig(CAL.brA+CAL.brM*c.m-CAL.brN*c.bridges);return `<p class="muted" style="font-size:.85rem">Bridge money buys time, not survival. Given its momentum${c.bridges?` and ${c.bridges} earlier bridge${c.bridges>1?'s':''}`:''}, the odds this one leads to a recovery are about <b>${Math.round(pOk*20)*5}%</b>. If it fails, the money is likely gone.</p>`})()}
    <div class="row"><button class="primary" data-act="decide" data-p="${p.pid}" data-c="accept" ${G.cash<=0?'disabled':''}>Fund the bridge · ${fmt$(Math.min(p.amount,G.cash))}</button>
    <button class="ghost danger" data-act="decide" data-p="${p.pid}" data-c="decline">Decline</button></div></article>`;
}

// Portfolio at a glance: one small tile per company, colored by where it stands.
function portGrid(own){
  const tile=c=>{
    const live=c.status==='alive'||c.status==='bridge', x=valueOf(c)/c.invested;
    let state,cls;
    if(live){ const [ml,mc]=momentumLabel(c); state=ml; cls=mc.replace('chip-',''); }
    else if(c.status==='dead'){ state='Shut down'; cls='bad'; }
    else { state=c.exitKind==='Soft landing'?'Sold for parts':c.exitKind==='IPO'?'IPO':'Acquired'; cls=x>=3?'good':x>=1?'acc':'bad'; }
    const inner=`<b>${esc(c.name)}</b><small>${state}${live?'':' · '+qLabel(c.exitQ)}</small><span class="tx">${fmtX(x)}</span>${c.crisis&&live?'<i class="needs" title="Needs your help this quarter">!</i>':''}`;
    return live?`<a class="tile t-${cls}" href="#pc-${c.id}">${inner}</a>`:`<div class="tile t-${cls} done">${inner}</div>`;
  };
  const exited=own.filter(c=>c.status==='exited'), dead=own.filter(c=>c.status==='dead');
  const wins=exited.filter(c=>c.returned>=c.invested).length, closed=exited.length+dead.length;
  const order=c=>(c.status==='alive'||c.status==='bridge')?0:1;
  return `<section class="glance"><div class="glance-h"><h2>At a glance</h2>
      <p>${own.length-closed} active · ${exited.length} exited · ${dead.length} shut down${closed?` · ${pct(wins/closed,0)} of closed deals returned their cost`:''}</p></div>
    <div class="tiles">${[...own].sort((a,b)=>order(a)-order(b)||valueOf(b)/b.invested-valueOf(a)/a.invested).map(tile).join('')}</div></section>`;
}
function portCard(c){
  const [ml,mc]=momentumLabel(c); const v=navOf(c); const trend=c.m-c.prevM;
  return `<article class="card pc" id="pc-${c.id}">
    <div class="pc-top">
      <div class="pc-name"><b>${esc(c.name)}</b><small>${c.sector} · ${STAGES[c.stage]} · in since ${qLabel(c.entryQ)}</small></div>
      <span class="chip ${mc}">${ml} ${trend>0.05?'↑':trend<-0.05?'↓':''}</span>
      <div class="kv"><small>Owned</small><span>${pct(c.own)}</span></div>
      <div class="kv"><small>Invested</small><span>${fmt$(c.invested)}</span></div>
      <div class="kv"><small>Mark</small><span>${fmt$(v)}</span></div>
      <div class="kv"><small>Multiple</small><span>${fmtX(v/c.invested)}</span></div>
      <div class="kv"><small>Next raise</small><span>${c.status==='bridge'?'now':`~${c.toRaise} qtr${c.toRaise>1?'s':''}`}${c.prep>0?' · prepped':''}</span></div>
    </div>
    ${c.crisis?`<div class="crisis"><b>Needs you:</b> ${esc(c.crisis.text)} Fix it this quarter with <b>${SUPPORT[c.crisis.fix].label}</b> or momentum takes a hit.</div>`:''}
    ${c.status==='alive'?`<div class="sup"><span class="lbl">Support</span>${Object.entries(SUPPORT).map(([k,s])=>`<button class="small ${c.supDone[k]?'done':''}" data-act="sup" data-id="${c.id}" data-k="${k}" title="${s.tip}" ${c.supDone[k]||G.hours<s.hours?'disabled':''}>${s.label} · ${s.hours}h</button>`).join('')}</div>`:''}
  </article>`;
}

function renderPortfolio(){
  const own=G.companies.filter(c=>c.owned);
  const live=own.filter(c=>c.status==='alive'||c.status==='bridge').sort((a,b)=>(b.crisis?1:0)-(a.crisis?1:0)||navOf(b)-navOf(a));
  const done=own.filter(c=>c.status==='exited'||c.status==='dead');
  if(!own.length) return `<div class="card empty"><h3>No investments yet</h3><p>Pick a deal from the deal flow tab. Your portfolio, follow-on offers and founder support live here.</p></div>`;
  return `${portGrid(own)}${G.pending.length?`<section class="decisions"><div class="section-h"><h2>Decisions this quarter</h2><p>If you don't decide by the end of the quarter, you pass on pro-rata, decline bridges and accept acquisition offers.</p></div>${G.pending.map(decisionCard).join('')}</section>`:''}
    <div class="section-h"><div><h2>Active portfolio</h2><p>${G.hours} of ${G.D.hours} partner hours left this quarter. Support in your thesis sector counts 30% more. Fundraising prep only matters if the company raises soon.</p></div></div>
    <div class="port">${live.length?live.map(portCard).join(''):'<div class="card empty">No active companies.</div>'}</div>
    ${done.length?`<div class="section-h"><h2>Exits and write-offs</h2></div>
    <div class="tablewrap"><table><thead><tr><th>Company</th><th>Outcome</th><th>When</th><th class="n">Invested</th><th class="n">Returned</th><th class="n">Multiple</th></tr></thead><tbody>
    ${done.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.status==='dead'?'Shut down':c.exitKind}${c.exitVal?' at '+fmt$(c.exitVal):''}</td><td>${qLabel(c.exitQ)}</td><td class="n">${fmt$(c.invested)}</td><td class="n">${fmt$(c.returned)}</td><td class="n">${fmtX(c.returned/c.invested)}</td></tr>`).join('')}
    </tbody></table></div>`:''}`;
}

function rateChart(){
  const W=640,H=210,pl=34,pr=12,pt=12,pb=28,n=TOTAL_QS;
  const x=q=>pl+(W-pl-pr)*q/n, y=v=>pt+(H-pt-pb)*(1-v/8);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fed funds rate and market regime by quarter">`;
  G.regimeHist.forEach((rg,i)=>{ s+=`<rect class="b-${rg}" x="${x(i)}" y="${pt}" width="${x(1)-x(0)}" height="${H-pt-pb}"/>`; });
  [0,2,4,6,8].forEach(v=>{ s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v}%</text>`; });
  for(let yr=0;yr<10;yr++) s+=`<text x="${x(yr*4+2)}" y="${H-10}" text-anchor="middle">Y${yr+1}</text>`;
  s+=`<line class="div" x1="${x(INVEST_QS)}" x2="${x(INVEST_QS)}" y1="${pt}" y2="${H-pb}"/><text x="${x(INVEST_QS)+4}" y="${pt+10}">harvest</text>`;
  const pts=G.rateHist.map((v,i)=>`${x(i+0.5).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  s+=`<polyline class="rate" points="${pts}"/>`;
  const last=G.rateHist.length-1; s+=`<circle class="dot" cx="${x(last+0.5)}" cy="${y(G.rateHist[last])}" r="4"/>`;
  return s+'</svg>';
}

  return `<div class="section-h"><div><h2>Market conditions</h2><p>Rates and the market regime set entry prices, how easily your companies raise, and whether exit windows are open.</p></div></div>
    <section class="card" style="padding:14px 16px;display:grid;gap:10px">${rateChart()}
      <div class="legend"><span><i class="lg-boom"></i>Boom</span><span><i class="lg-normal"></i>Normal</span><span><i class="lg-correction"></i>Correction</span><span><i class="lg-recession"></i>Recession</span><span>Line: Fed funds rate</span></div></section>

// J-curve: LPs' cumulative net cash flow (distributions minus capital calls and fees) by quarter.
function jCurve(){
  const W=640,H=220,pl=46,pr=12,pt=12,pb=28,n=TOTAL_QS;
  const pts=[{q:0,net:0},...G.hist];
  const vals=pts.map(p=>p.net/1e6);
  const lo=Math.min(-10,...vals), hi=Math.max(10,...vals);
  const step=(hi-lo)>120?50:(hi-lo)>50?20:10;
  const yLo=Math.floor(lo/step)*step, yHi=Math.ceil(hi/step)*step;
  const x=q=>pl+(W-pl-pr)*q/n, y=v=>pt+(H-pt-pb)*(1-(v-yLo)/(yHi-yLo));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="J-curve: LP cumulative net cash flow by quarter">`;
  for(let v=yLo;v<=yHi;v+=step) s+=`<line class="grid${v===0?' zero':''}" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v<0?'-':''}$${Math.abs(v)}M</text>`;
  for(let yr=0;yr<10;yr++) s+=`<text x="${x(yr*4+2)}" y="${H-10}" text-anchor="middle">Y${yr+1}</text>`;
  s+=`<line class="div" x1="${x(INVEST_QS)}" x2="${x(INVEST_QS)}" y1="${pt}" y2="${H-pb}"/><text x="${x(INVEST_QS)+4}" y="${pt+10}">harvest</text>`;
  const line=pts.map(p=>`${x(p.q).toFixed(1)},${y(p.net/1e6).toFixed(1)}`).join(' ');
  s+=`<polygon class="jc-area" points="${x(0)},${y(0)} ${line} ${x(pts[pts.length-1].q)},${y(0)}"/>`;
  s+=`<polyline class="jc-line" points="${line}"/>`;
  const L=pts[pts.length-1]; s+=`<circle class="jc-dot" cx="${x(L.q)}" cy="${y(L.net/1e6)}" r="4"/>`;
  return s+'</svg>';
}

function renderFund(){
  const S=settle(), paid=S.paidIn, ir=G.q>=8?netIrrLive():null;
  const exits=G.companies.filter(c=>c.owned&&c.status==='exited').sort((a,b)=>a.exitQ-b.exitQ);
  const trough=Math.min(0,...G.hist.map(h=>h.net));
  return `<div class="section-h"><div><h2>LP view</h2><p>What your limited partners see: the capital you call, the fees they pay, what comes back, and what you keep as carry.</p></div></div>
    <section class="score">
      <div class="card kpi"><small>Paid-in capital</small><b>${fmt$(paid)}</b><span>${fmt$(G.lp.called)} invested + ${fmt$(G.lp.fees)} fees, of $50M committed</span></div>
      <div class="card kpi"><small>Distributed</small><b>${fmt$(G.lp.dist)}</b><span>Cash back to LPs after carry</span></div>
      <div class="card kpi"><small>Net DPI</small><b>${fmtX(S.dpi)}</b><span>Distributed ÷ paid-in</span></div>
      <div class="card kpi"><small>Net TVPI</small><b>${paid?fmtX(S.tvpi):'—'}</b><span>Cash back plus marks, after fees and carry</span></div>
      <div class="card kpi"><small>Net IRR</small><b>${ir==null?'—':pct(ir,1)}</b><span>${G.q<8?'Not meaningful before year 3':'Annualized, on LP cash flows'}</span></div>
      <div class="card kpi"><small>Carry paid to you</small><b>${fmt$(G.gp.carry)}</b><span>${S.clawback>0?`<span style="color:var(--bad)">${fmt$(S.clawback)} at risk of clawback</span>`:'20% of each exit’s profit'}</span></div>
    </section>
    <section class="card" style="padding:14px 16px;display:grid;gap:10px"><p class="eyebrow">The J-curve</p>${jCurve()}
      <p class="muted" style="font-size:.85rem">LPs' cumulative cash in minus cash out. Fees and investments push it down in the early years. Exits pull it back up, usually late. ${trough<0?`The deepest point so far is ${fmt$(trough)}.`:''} The fund breaks even for LPs in cash terms when the line crosses zero.</p></section>
    <div class="mk">
      <section class="card" style="padding:14px 16px;display:grid;gap:8px"><p class="eyebrow">Fund terms</p>
        <div class="tablewrap" style="border:0"><table><tbody>
          <tr><td>LP commitments</td><td class="n">$50M</td></tr>
          <tr><td>GP commitment</td><td class="n">${G.gpCommit?`${fmt$(G.gpCommit)} (${pct(G.gpPct,0)})`:'None'}</td></tr>
          <tr><td>Management fee</td><td class="n">2% a year · ${fmt$(FEE_Q)} a quarter</td></tr>
          <tr><td>Fees paid so far</td><td class="n">${fmt$(G.lp.fees)} of $10M</td></tr>
          <tr><td>Carried interest</td><td class="n">20%, deal by deal</td></tr>
          <tr><td>Investable capital</td><td class="n">${fmt$(G.investable)}</td></tr>
          <tr><td>Your capital kept outside the fund</td><td class="n">${fmt$(G.gpKept)}</td></tr>
        </tbody></table></div></section>
      <section class="card" style="padding:14px 16px;display:grid;gap:8px"><p class="eyebrow">How the American waterfall works</p>
        <p style="font-size:.88rem">Each exit settles on its own. LPs get back the capital that went into that company, and the GP takes 20% of the profit above it right away, even if other companies are losing money.</p>
        <p style="font-size:.88rem">That makes carry arrive early, so at the end of the fund there's a <b>clawback</b> test: across the whole fund, the GP may keep only 20% of LP profit after fees. Anything above that goes back to LPs.</p>
        <p class="muted" style="font-size:.82rem">At today's marks, whole-fund carry would be ${fmt$(S.fair)}. ${S.clawback>0?`You've been paid ${fmt$(G.gp.carry)}, so you'd owe back ${fmt$(S.clawback)}.`:`You've been paid ${fmt$(G.gp.carry)} so far.`}</p></section>
    </div>
    ${exits.length?`<div class="section-h"><h2>Distributions</h2></div>
    <div class="tablewrap"><table><thead><tr><th>Company</th><th>When</th><th class="n">LP share of proceeds</th><th class="n">LP cost</th><th class="n">Carry to GP</th><th class="n">Net to LPs</th></tr></thead><tbody>
    ${exits.map(c=>`<tr><td>${esc(c.name)}</td><td>${qLabel(c.exitQ)}</td><td class="n">${fmt$(c.lpGross||0)}</td><td class="n">${fmt$(c.invested*(1-G.gpShare))}</td><td class="n">${fmt$(c.carry||0)}</td><td class="n">${fmt$(c.lpNet||0)}</td></tr>`).join('')}
    </tbody></table></div>`:''}`;
}

    q:'When is a diligence call worth a higher price? What could you do before a pitch so you need fewer calls?'}),
  prorata:d=>({t:'Reserves and signaling',b:`${d.name} just raised at a ${d.step.toFixed(1)}x step-up, and your stake was diluted from ${pct(d.ownPre)} to ${pct(d.ownPost)}. Keeping it costs ${fmt$(d.amount)}. Seed funds hold back 40–60% of the fund for decisions like this. Passing as a major holder tells other investors you have lost faith.`,
    q:'Should reserves go to your strongest companies or to the ones that need help? What does it signal when an existing investor passes?',f:FIELD['Pro-rata is a right']+' '+FIELD['Reserves ratio']}),
  bridge:d=>({t:'Bridges buy time, not survival',b:`${d.name} could not raise its next round and is asking insiders for ${fmt$(d.ask)}. You already have ${fmt$(d.invested)} in it. That money is spent either way. The only question is whether the next dollar has better odds here than anywhere else in your fund.`,
    q:'How do you keep sunk cost out of the decision? What would you need to see before funding this bridge?',f:FIELD['Write-down triggers']}),

  carry:d=>({t:'Carried interest and the waterfall',b:`On ${d.name}, LPs made ${fmt$(d.profit)} of profit, and you earned ${fmt$(d.carry)} of carry (20%). Under an American waterfall, carry is paid deal by deal. A clawback at year 10 makes sure you keep no more than 20% of the whole fund’s profit after fees.`,

// Field notes: the author's own takeaways from the Venture Institute (Decile Group, Cohort 7) and fund work.
const AUTHOR='Bryan Hanley', AUTHOR_CRED='Venture Institute (Decile Group) Cohort 7 graduate and VC resident';
const FIELD_NOTES=[
  ['Post-money SAFE','Most first checks today are post-money SAFEs, not priced rounds. With a post-money cap you know your ownership the day you sign: $250K on a $5M post-money SAFE is about 5% fully diluted. Many SAFEs also carry a 10–25% discount to the next round and a most-favored-nation clause.'],
  ['Term sheet','A term sheet is non-binding. It is the negotiating document; the binding agreement (a SAFE or a stock purchase agreement) comes after. Many seed deals skip it and go straight to a SAFE.'],
  ['Pre-money vs. post-money','Post-money is pre-money plus the new money. A $2M check on a $10M pre-money makes a $12M post-money, so the check buys 16.7%, not 20%. Ownership always comes from the post-money.'],
  ['Pro-rata is a right','Pro-rata is a right, not an obligation. If you own 20% and the company raises $5M, keeping 20% means buying $1M of the new round.'],
  ['Option pool','Usually 10–20% of the company, and often enlarged at seed and Series A. A bigger pool dilutes founders and early investors, so its size and timing are a real negotiation.'],
  ['Committed vs. called capital','LPs commit up front; the GP draws the money down through capital calls as deals happen. Funds call capital right before they use it so LP money is not sitting idle.'],
  ['Vintage','The year a fund starts investing. Funds are compared within a vintage because each one faced a different market.'],
  ['Markups are not cash','A new round at a higher price lifts TVPI on paper. Only DPI counts money LPs actually got back, and every markup should point to outside evidence, not founder optimism.'],
  ['Hurdles are rare in venture','A hurdle (often 8%) makes LPs earn a minimum return before carry. It is common in private equity but appears in only about 10–12% of venture funds, because 7–10 year holding periods make compounding hurdles hard to clear. With a catch-up, the GP then takes a larger share until it reaches its 20%.'],
  ['Escrowed carry','Under a deal-by-deal (American) waterfall, GPs often hold part of their carry in escrow, in case the whole fund ends up returning less and the clawback kicks in.'],
  ['Reserves ratio','Seed funds often split about 50/50 between first checks and follow-ons. Very small funds may reserve closer to 30% and spread more first checks to maximize starting ownership.'],
  ['Thesis fit breaks ties','The thesis anchors every decision. When two strong deals compete for the same check, thesis fit usually beats raw return potential: it tells a clearer story to LPs, benefits most from the fund’s expertise, and is easier to support with follow-ons.'],
  ['What decides a deal','After thesis fit: portfolio construction, founder quality and coachability, return profile and ownership, time sensitivity, and the story the deal tells LPs.'],
  ['Who breaks a tie','Many seed funds skip a formal investment committee, but one adds objectivity. When partners split, the committee or managing partners decide. LPs stay out of individual deals to keep their limited liability, except in narrow cases like concentration limits or conflicts of interest.'],
  ['Claims vs. evidence','Every founder number is a claim until it is checked against a primary source. Good diligence labels what could not be verified instead of quietly trusting it.'],
  ['The downside case','Ask what happens if most things go wrong, not only what happens if everything goes right.'],
  ['Losers ripen first','Early in a fund the power law looks inverted: failures arrive in 3–5 years, winners take 7–10. Around year 7.5, 40–60% of a portfolio can be zombies, 20–30% modest 1–3x outcomes, and one to three companies decide the fund.'],
  ['Write-down triggers','Mark a company down when runway falls under six months with no credible investor, when a down round closes, or when it loses a key founder or customer. A position that grows past ~15% of NAV deserves a second opinion and a note to LPs.'],
  ['Same multiple, different IRR','Two funds can return the same TVPI with very different IRRs. Cash back in year 3 is worth far more than the same cash in year 8.'],
  ['Capital efficiency','Some of the best outcomes raise very little. One solar-monitoring software company raised about $16M in total and sold for roughly $695M.'],
  ['Network before you need it','Relationships compound. Some seed deals happen because an investor knew the founder for years before the company existed.'],
  ['Diversify at seed','The power law is steeper at seed than at later stages. Backing more companies, 40 or so for a seed fund, raises the odds of catching the outlier that returns the fund.'],
];

  ['Post-money valuation','The company’s value including the new money. Ownership = check ÷ post-money.'],
  ['SAFE and valuation cap','A SAFE converts to shares at a later round. The post-money cap is the highest price the investor’s money converts at.'],

     demo:`<div class="tut-demo"><div class="verdict-bar four"><button tabindex="-1"><span>Pass</span><kbd>P</kbd></button><button tabindex="-1"><span>Pass &amp; refer</span><kbd>R</kbd></button><button tabindex="-1"><span>Diligence call</span><kbd>D</kbd></button><button class="primary" tabindex="-1"><span>Invest</span><kbd>I</kbd></button></div><p class="tut-cap">Revenue (ARR) <b>$587K</b> <span class="tag">deck</span> &nbsp;·&nbsp; Monthly burn <span class="ask">ask</span></p></div>`},
    {t:'Price and time', b:`Rounds move while you think. Each diligence call takes about two weeks. In a hot round the price (the valuation cap) steps up every two weeks and the round can close without you. Your ownership is your check divided by that price, so paying twice as much means owning half as much. A close relationship with the lead investor holds your place at the first price.`,

    {t:'Your portfolio', b:`Once you own a company, decisions come to you. When it raises again you can invest more to keep your stake. When it struggles, insiders are asked for a bridge loan. When a buyer appears, the board votes on the sale. You also get a few partner hours each quarter to help founders through problems.`,
     demo:`<ul class="tut-list"><li><b>Follow-on</b><span>Keep your ownership as the company grows</span></li><li><b>Bridge</b><span>Buy a struggling company time, with real risk</span></li><li><b>Acquisition offer</b><span>Sell now, or hold out for more</span></li><li><b>Partner hours</b><span>Recruiting, customer intros, board sessions</span></li></ul>`},
    {t:'How you are scored', b:`Most startups fail, so a few winners have to pay for everything else. Your LPs also pay a 2% yearly fee and give you 20% of the profits (carry), so what they receive is less than what your companies earn. Your score is net TVPI: what LPs get back per dollar they put in. At the end, the game compares your fund with real venture funds.`,
     demo:`<div class="tut-demo"><div class="wflow"><div class="wstat"><b>2.4x</b><small>gross multiple</small></div><span>→</span><div class="wstat"><b>−fees</b><small>2% a year</small></div><span>→</span><div class="wstat"><b>−carry</b><small>20% of profit</small></div><span>→</span><div class="wstat"><b>1.8x</b><small>net TVPI to LPs</small></div></div></div>`},
    {t:'Reading the screen', b:`The bar at the top tracks your fund. Tabs below it hold your portfolio, your relationships with other funds, what your LPs see, the market, and your Notebook of lessons and definitions. ${G&&G.teach?'The first time a concept comes up, a short card explains it with your own numbers. ':''}Press End quarter when you are done with a quarter.`,
     demo:`<table class="glance tut-hud"><tbody><tr><th scope="row">Dry powder</th><td>Money you have left to invest</td></tr><tr><th scope="row">Calls</th><td>Diligence calls left for the whole fund</td></tr><tr><th scope="row">Hours</th><td>Partner hours left this quarter</td></tr><tr><th scope="row">Market</th><td>Boom, normal, correction or recession, plus the interest rate</td></tr><tr><th scope="row">Net TVPI</th><td>Your score so far, after fees and carry</td></tr><tr><th scope="row">Founder rep</th><td>How founders talk about you</td></tr></tbody></table>`},
  ];

function renderTutorial(M){
  const S=tutSteps(), i=M.i, st=S[i], last=i===S.length-1;
  return `<div class="tut">
    <div class="tut-top"><p class="eyebrow">How to play · ${i+1} of ${S.length}</p><button class="ghost small" data-act="tutClose">Skip</button></div>

    <div class="wnav"><button class="ghost" data-act="tutGo" data-d="-1" ${i===0?'disabled':''} aria-label="Previous step">←</button>
      <span class="wdots">${S.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</span>
      ${last?`<button class="primary" data-act="tutClose">Start playing</button>`:`<button class="primary" data-act="tutGo" data-d="1">Next →</button>`}</div></div>`;
}

function renderNetwork(){
  const meter=(v,marks)=>`<span class="relbar"><i style="width:${v}%"></i>${marks.map(m=>`<b style="left:${m}%"></b>`).join('')}</span>`;
  const perks=f=>[f.refers?[f.thr,`Shares deals with you`]:null,[60,'Saves you room in hot rounds it leads'],f.id==='copperline'?[60,'Your Series A+ companies raise more easily']:null,f.id==='larchmere'?[60,'Refers its best deals: much stronger companies']:null].filter(Boolean);
  return `<div class="section-h"><div><h2>Network</h2><p>Relationships open doors. Co-investors share deals and save you room in hot rounds. Founders talk to each other about how you treat them.</p></div></div>
    <section class="card netrep"><div><p class="eyebrow">Founder reputation</p><b class="repnum">${Math.round(G.rep)}</b><span class="muted"> / 100 · ${REP_TIER(G.rep)}</span></div>
      ${meter(G.rep,[60,75])}
      <ul class="perks"><li class="${G.rep>=60?'on':''}">60+: portfolio founders introduce you to other founders</li><li class="${G.rep>=75?'on':''}">75+: you get into every hot round</li></ul>
      <p class="muted" style="font-size:.82rem">Goes up when you fund, support founders, fix crises and stand behind bridges. Goes down when you pass after a lot of calls, decline bridges, ignore crises or block a sale a founder wants.</p></section>
    <div class="funds">${FUNDS.map(f=>{const v=G.rel[f.id], log=G.relLog.filter(x=>x.fid===f.id).slice(-3).reverse();
      return `<section class="card fundcard"><header><div class="avatar" aria-hidden="true">${f.short.slice(0,2).toUpperCase()}</div><div><h3>${f.name}</h3><small>Leads ${f.leads.map(i=>STAGES[i]).join(', ')}</small></div><span class="chip ${v>=60?'chip-good':v>=35?'chip-acc':''}">${relTier(v)}</span></header>
        <p class="fstyle">${f.style}</p>
        <div class="relrow">${meter(v,[35,60,80])}<span class="num">${Math.round(v)}</span></div>
        <ul class="perks">${perks(f).map(([t,l])=>`<li class="${v>=t?'on':''}">${t}+: ${l}</li>`).join('')}</ul>
        ${log.length?`<ul class="flog">${log.map(x=>`<li class="${x.d>0?'up':'down'}">${x.d>0?'+':''}${x.d} · ${esc(x.why)}</li>`).join('')}</ul>`:''}
        <button class="small" data-act="coffee" data-f="${f.id}" ${G.coffee[f.id]||G.hours<1?'disabled':''}>${G.coffee[f.id]?'Had coffee this quarter':'Grab coffee · 1 partner hour'}</button></section>`;}).join('')}</div>
    <section class="card" style="padding:14px 16px"><p class="eyebrow">How relationships grow</p>
      <ul class="perks" style="margin-top:6px"><li>Co-invest in rounds they lead (+6) and take your full pro-rata next to them (+3)</li><li>Refer deals you pass on (+5), and more if the company does well. Referring a dud costs you.</li><li>Split bridges with them (+4). Leaving them to carry one costs more (−6).</li><li>Coffee (+4, one partner hour). Relationships above their starting point fade a little each quarter.</li></ul></section>`;
}
function lessonList(withNum){
  const seen=LESSON_ORDER.filter(k=>G.lessonsSeen.includes(k));
  if(!seen.length) return '<p class="muted">No teaching moments yet. They appear the first time a concept comes up in your fund.</p>';
  return `<ol class="lessons">${seen.map(k=>{const L=G.lessonLog&&G.lessonLog[k]; return `<li><b>${L?esc(L.t):k}</b>${L?` <span class="muted">· ${qLabel(L.q)}</span><p>${esc(L.b)}</p>${L.f?`<p class="fnote"><b>Field note:</b> ${esc(L.f)}</p>`:''}<p class="lq"><b>Discuss:</b> ${esc(L.qq)}</p>`:''}</li>`;}).join('')}</ol>`;
}
function renderNotebook(){
  return `<div class="section-h"><div><h2>Notebook</h2><p>Every concept you have met so far, the glossary, and the full fund log.</p></div><div class="row" style="display:flex;gap:8px"><button class="small" data-act="openTut">How to play</button><button class="ghost small" data-act="askRestart">Start a new fund</button></div></div>
    <section class="card" style="padding:14px 16px;display:grid;gap:8px"><p class="eyebrow">Teaching moments · ${G.lessonsSeen.length} of ${LESSON_ORDER.length}</p>${lessonList()}</section>
    <details class="card" style="padding:14px 16px" open><summary>Field notes · ${FIELD_NOTES.length} from ${AUTHOR}</summary><p class="muted" style="font-size:.82rem;margin-top:6px">How these ideas show up in practice, from the author's notes as a ${AUTHOR_CRED}.</p><dl class="gloss">${FIELD_NOTES.map(([t,d])=>`<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl></details>
    <details class="card" style="padding:14px 16px"><summary>Glossary · ${GLOSSARY.length} terms</summary><dl class="gloss">${GLOSSARY.map(([t,d])=>`<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl></details>
    <details class="card" style="padding:14px 16px"><summary>Fund log</summary><div class="log" style="margin-top:10px">${[...G.log].reverse().map(l=>`<div><span>${qLabel(l.q)}</span><span>${esc(l.text)}</span></div>`).join('')}</div></details>`;

function renderModal(){
  const M=G.modal; if(!M) return '';
  let body='';
  if(M.type==='call'){
    const c=byId(M.cid);
    if(!M.lines){
      body=`<div class="modal-h"><div><p class="eyebrow">Diligence call · uses 1 of ${G.calls} left</p><h2>${esc(c.founder)}, ${esc(c.name)}</h2></div><button class="ghost small" data-act="close">Cancel</button></div>
        <p class="muted">Pick up to ${QPERCALL} questions. Grayed ones you've already asked.</p>
        ${c.terms?(()=>{const after=c.week+WEEKS_PER_CALL, closes=after>=closeWeek(c), capA=capAt(c,after), cur=capNow(c);
          return closes?`<div class="flag"><b>This call outlasts the round.</b> It takes about two weeks and the round closes at week ${closeWeek(c)}. You won't be able to invest afterwards.</div>`
            :capA>cur?`<div class="flag warn"><b>The price will move.</b> This call takes about two weeks. By the time you hang up, the cap rises from ${fmt$(cur)} to ${fmt$(capA)}.</div>`
            :`<p class="muted" style="font-size:.85rem">This call takes about two weeks. The cap stays at ${fmt$(cur)}.</p>`;})():''}
        <div class="qs">${QUESTIONS.map(([k,t])=>{const asked=c.asked.includes(k),on=M.picked.includes(k);return `<button class="q ${on?'on':''} ${asked?'asked':''}" data-act="pickQ" data-k="${k}" ${asked?'disabled':''} aria-pressed="${on}">${t}</button>`}).join('')}</div>
        <div class="mfoot"><button class="primary" data-act="runCall" ${M.picked.length?'':'disabled'}>Start the call (${M.picked.length}/${QPERCALL})</button></div>`;
    } else {
      const mv=c.lastMove, closedNow=c.pitch==='lost';
      body=`<div class="modal-h"><div><p class="eyebrow">Call notes · ${G.calls} calls left</p><h2>${esc(c.name)}</h2></div></div>
        ${closedNow?`<div class="flag"><b>The round closed while you were on the phone.</b> ${c.lead?FUND_BY[c.lead].name:'Faster funds'} filled it.</div>`:mv&&mv.to>mv.from?`<div class="flag warn"><b>The round moved.</b> While you were on the call, the cap went from ${fmt$(mv.from)} to ${fmt$(mv.to)}.</div>`:''}
        <div class="transcript">${M.lines.map((l,i)=>`<div class="tline"><span class="who">00:${String(4+i*7).padStart(2,'0')} · You</span><span class="you">${esc(l.q)}</span>
          <span class="who">${esc(c.founder.split(' ')[0])}</span><span class="them">“${esc(l.quote)}”</span>
          ${l.fact?`<span class="data">${esc(l.fact[0])}: ${esc(l.fact[1])}</span>`:''}
          ${l.flag?`<div class="flag ${l.level==='warn'?'warn':''}"><b>${l.level==='warn'?'Watch:':'Red flag:'}</b> ${esc(l.flag)}</div>`:''}</div>`).join('')}</div>
        <div class="mfoot"><button data-act="close">Back to the pitch</button><button class="primary" data-act="openInvest" data-id="${c.id}" ${closedNow?'disabled':''}>Invest</button></div>`;
    }
  }
  if(M.type==='invest'){
    const c=byId(M.cid), opts=checkOptions(c), sel=opts[M.choice]||opts.find(o=>o.ok);
    const after=sel?G.cash-sel.amt:G.cash;
    body=`<div class="modal-h"><div><p class="eyebrow">Term sheet · ${STAGES[c.stage]}</p><h2>Invest in ${esc(c.name)}</h2></div><button class="ghost small" data-act="close">Cancel</button></div>
      ${(()=>{const price=capNow(c)||c.post, first=c.terms?c.terms.tr[0].cap:price;
        return `<p>${fmt$(c.round)} round. You're buying at a <b>${fmt$(price)}</b> post-money ${c.stage<2?'cap (SAFE)':'valuation'}. 1x non-participating preferred.</p>
        ${price>first?`<div class="flag warn"><b>You're paying up.</b> First close was ${fmt$(first)}. At ${fmt$(price)}, the same check buys ${pct(1-first/price,0)} less of the company.</div>`:c.negCap?`<p class="pref-note">You negotiated this cap down. The same check buys more of the company than the rest of the round gets.</p>`:''}`;})()}
      <div class="checks">${opts.map((o,i)=>`<button class="check ${sel===o?'on':''}" data-act="pickCheck" data-i="${i}" ${o.ok?'':'disabled'}><b>${o.label}</b><span>${fmt$(o.amt)} for ${pct(o.amt/(capNow(c)||c.post))} ownership${o.hotBlock?' · round is oversubscribed, no lead allocation':''}</span><span class="num">${o.ok?'':'n/a'}</span></button>`).join('')}</div>
      <p class="muted" style="font-size:.85rem">Dry powder after this check: <b class="num">${fmt$(after)}</b> (${pct(after/G.investable,0)} of investable capital). ${c.calls?'':'You haven\'t taken a diligence call on this company.'}</p>
      <div class="mfoot"><button class="primary" data-act="confirmInvest" ${sel?'':'disabled'}>Wire ${sel?fmt$(sel.amt):''}</button></div>`;
  }
  if(M.type==='neg'){
    const c=byId(M.cid), cur=M.result?M.result.cur:capNow(c), R=M.result;
    const odds=p=>p>0.66?'likely':p>0.4?'possible':p>0.2?'a stretch':'a long shot';
    body=`<div class="modal-h"><div><p class="eyebrow">Negotiate · nobody is leading this round</p><h2>Propose a lower cap to ${esc(c.founder.split(' ')[0])}</h2></div>${R?'':'<button class="ghost small" data-act="close">Cancel</button>'}</div>
      ${R?`<div class="${R.ok?'pref-note':'flag warn'}"><b>${R.ok?'Accepted.':'Turned down.'}</b> ${R.ok?`Your cap is ${fmt$(c.negCap)}, down from ${fmt$(R.cur)}. On a $1M check, that's ${pct(1e6/c.negCap,1)} of the company instead of ${pct(1e6/R.cur,1)}.`:`${esc(c.founder.split(' ')[0])} is sticking with ${fmt$(R.cur)}. ${R.disc>=0.25?'Asking for that much off cost you a little goodwill with founders.':''}`} The back-and-forth took a week.</div>
        <div class="mfoot"><button class="primary" data-act="close">Back to the pitch</button></div>`
      :`<p>The cap is ${fmt$(cur)} today. With no lead, whoever writes the first check helps set the price. Founders say yes more often when demand is soft and your reputation is good, and a lowball on a hot round can backfire. You get one try, and it takes about a week.</p>
      <div class="checks">${[0.1,0.2,0.3].map(dz=>`<button class="check" data-act="negotiate" data-disc="${dz}"><b>${pct(dz,0)} lower</b><span>${fmt$(cur*(1-dz))} cap · $1M buys ${pct(1e6/(cur*(1-dz)),1)}</span><span class="num">${odds(negOdds(c,dz))}</span></button>`).join('')}</div>`}`;
  }
  if(M.type==='tut') body=renderTutorial(M);
  if(M.type==='turn'){
    const T=G.turn, jumped=G.q-T.pq>1, changed=T.pr!==G.regime, up=ORDER.indexOf(G.regime)<ORDER.indexOf(T.pr);
    const heads=G.recap.slice(0,6), more=G.recap.length-heads.length, n=G.q<INVEST_QS?G.deals.length:0, needs=G.pending.length+G.companies.filter(c=>c.owned&&c.status==='alive'&&c.crisis).length;
    body=`<div class="turn reg-${G.regime}">
      <p class="eyebrow">${jumped?`Fast-forward · ${G.q-T.pq} quarters`:'New quarter'}</p>
      <h2 class="turn-when">Year ${Math.floor(G.q/4)+1} <span>·</span> Q${G.q%4+1}</h2>
      <div class="turn-wx">${weather(G.regime,'big')}<div><b>${REGIMES[G.regime].label} market</b><span>${changed?`${up?'Improving':'Worsening'} from ${REGIMES[T.pr].label.toLowerCase()}`:'Holding steady'} · Fed funds ${G.rate.toFixed(2)}%</span></div></div>
      ${heads.length?`<ul class="turn-news">${heads.map(r=>`<li class="${r.t}">${esc(r.text)}</li>`).join('')}</ul>${more>0?`<p class="muted" style="font-size:.8rem">${more} more in the Notebook's fund log.</p>`:''}`:''}
      <p class="turn-next">${n?`${n} founders are waiting in the lobby.`:needs?`${needs} decision${needs>1?'s':''} need${needs>1?'':'s'} you in the portfolio.`:'Your portfolio is quiet this quarter.'}</p>
      <div class="mfoot"><button class="primary big" data-act="turnGo">Continue <kbd>Enter</kbd></button></div></div>`;
  }
  if(M.type==='lesson'){
    const L=G.lessonQ[0]; if(L){ const C=LESSONS[L.key](L.d);
      body=`<div class="lesson-card"><p class="eyebrow">Teaching moment · ${G.lessonsSeen.length} of ${LESSON_ORDER.length} concepts</p><h2>${C.t}</h2><p class="lb">${esc(C.b)}</p>
        ${C.f?`<div class="fnote"><b>Field note · ${AUTHOR}</b><p>${esc(C.f)}</p></div>`:''}
        <div class="lq"><b>For discussion</b><p>${esc(C.q)}</p></div>
        <div class="mfoot"><span class="muted" style="font-size:.8rem;margin-right:auto">Saved to your Notebook.</span><button class="primary" data-act="lessonOk">Got it</button></div></div>`; }
  }
  if(M.type==='wrap') body=renderWrap(M);
  if(M.type==='events'&&G.events[M.i].t==='miss'){
    const E=G.events[M.i], c=byId(E.cid), N=G.events.length, last=M.i>=N-1, first=c.founder.split(' ')[0];
    body=`<div class="tomb miss">
      <div class="tomb-top"><p class="eyebrow">The one that got away · ${qLabel(E.q)}${N>1?` · ${M.i+1} of ${N}`:''}</p>${N>1?`<button class="ghost small" data-act="evSkip">Skip all</button>`:''}</div>
      <p class="tomb-kind">${E.kind==='IPO'?'Went public':'Acquired'} without you</p>
      <h2>${esc(c.name)}</h2>
      <p class="one muted">${esc(c.oneLiner)} · pitched you in ${qLabel(c.entryQ)}</p>
      <blockquote>${E.lost?`You lost this round to ${c.lead?FUND_BY[c.lead].name:'a faster fund'}.`:'You passed.'} It just ${E.kind==='IPO'?'went public':'sold'} at ${fmt$(E.val)}. ${esc(first)} sent a note: \u201c${E.lost?'You were close. Maybe next time, move faster.':'Remember when you passed? No hard feelings. Mostly.'}\u201d</blockquote>
      <div class="tomb-big"><b>${fmtX(E.x)}</b><span>what a $1M check would have returned</span></div>
      ${E.refTo?`<p class="pref-note">You referred it to ${FUND_BY[E.refTo].name}. They haven't forgotten.</p>`:''}
      <div class="mfoot"><button class="primary" data-act="evNext">${last?'Back to the fund':`Next · ${M.i+2} of ${N}`}</button></div></div>`;
  } else if(M.type==='events'){
    const E=G.events[M.i], c=byId(E.cid), N=G.events.length, last=M.i>=N-1;
    const dead=E.t==='dead', x=dead?0:E.ret/E.inv, good=!dead&&x>=1;
    const kind=dead?'Shut down':E.kind==='IPO'?'Went public':E.kind==='Soft landing'?'Sold for parts':'Acquired';
    const row=(l,v,cls='')=>`<tr><td>${l}</td><td class="n ${cls}">${v}</td></tr>`;
    body=`<div class="tomb ${good?(x>=3?'great':'good'):'bad'}">
      <div class="tomb-top"><p class="eyebrow">${dead?'Write-off':'Exit'} · ${qLabel(E.q)}${N>1?` · ${M.i+1} of ${N}`:''}</p>${N>1?`<button class="ghost small" data-act="evSkip">Skip all</button>`:''}</div>
      <p class="tomb-kind">${kind}</p>
      <h2>${esc(c.name)}</h2>
      <p class="one muted">${esc(c.oneLiner)} · ${c.sector} · backed at ${STAGES[c.entryStage]}, ${qLabel(c.entryQ)}</p>
      <blockquote>${esc(E.why)}</blockquote>
      <div class="tomb-big"><b>${dead?'0x':fmtX(x)}</b><span>${dead?`${fmt$(E.inv)} written off`:`${fmt$(E.ret)} back on ${fmt$(E.inv)} invested`}</span></div>
      ${dead?'':`<div class="tablewrap" style="border:0"><table><tbody>
        ${row(E.kind==='IPO'?'Valuation at IPO':'Sale price',fmt$(E.val))}
        ${row('Your fund’s proceeds',fmt$(E.ret))}
        ${row('Net to your LPs',fmt$(E.lpNet))}
        ${row('Carry to you',E.carry>0?fmt$(E.carry):'$0 · no profit on this deal',E.carry>0?'pos':'')}
      </tbody></table></div>
      ${E.pref&&E.ret>E.common+1?`<p class="pref-note"><b>Your 1x preference paid off.</b> The sale price was below the ${fmt$(E.raised)} investors put in, so preferred holders were paid first. You got ${fmt$(E.ret)}; as common stock you'd have gotten ${fmt$(E.common)}.</p>`:''}`}
      <div class="mfoot"><button class="primary" data-act="evNext">${last?'Back to the fund':`Next · ${M.i+2} of ${N}`}</button></div>
    </div>`;
  }
  if(M.type==='confirmEnd'){
    const wf=waitingFounders();
    body=`<div class="modal-h"><h2>End the quarter?</h2></div><p>${[wf?`${wf} founder${wf>1?'s haven\'t':' hasn\'t'} heard from you yet. Ending now passes on ${wf>1?'them':'it'}.`:'',G.pending.length?`You have ${G.pending.length} open portfolio decision${G.pending.length>1?'s':''}. Ending now passes on pro-rata offers and declines bridge requests.`:''].filter(Boolean).join(' ')}</p>
      <div class="mfoot"><button data-act="close">Go back</button><button class="primary" data-act="forceEnd">End quarter anyway</button></div>`;
  }
  if(M.type==='restart'){
    body=`<div class="modal-h"><h2>Start a new fund?</h2></div><p>This fund's progress will be lost.</p>
      <div class="mfoot"><button data-act="close">Keep playing</button><button class="primary danger" data-act="restart">Start over</button></div>`;
  }
  return `<div class="overlay" data-act="overlay"><div class="card modal" role="dialog" aria-modal="true">${body}</div></div>`;
}

function verdict(irr,tvpi){
  if(irr==null) return tvpi>=1?['Returned the fund','LPs got their money back, but not much more.']:['Lost LP money','Below 1x net. Fund II is in doubt.'];
  const beat=irr>=SP500_10Y;
  if(irr>=BENCH_IRR[0].irr) return ['Top decile',`Net IRR above ${pct(BENCH_IRR[0].irr,1)}. A fund that defines a career, and LPs will line up for Fund II.`];
  if(irr>=BENCH_IRR[1].irr) return ['Top quartile','Fund II should be an easy raise.'];
  if(irr>=BENCH_IRR[2].irr) return ['Above median',beat?'Better than most venture funds, and LPs beat the S&P 500.':`Better than most venture funds, but LPs would have done better in the S&P 500 (${pct(SP500_10Y,1)}). Fund II will take work.`];
  if(irr>=BENCH_IRR[3].irr) return ['Below median',`Your LPs earned less than a typical venture fund and less than the S&P 500. Raising Fund II will be hard.`];
  return tvpi>=1?['Bottom quartile','LPs got their money back, but barely beat cash. Fund II is in doubt.']:['Bottom quartile','Below 1x net. LPs lost money and Fund II is in doubt.'];
}

// Rough percentile among real US venture funds, interpolated from the Carta net IRR tiers.
function irrPercentile(irr){
  if(irr==null) return null;
  const pts=[[-0.10,1],[BENCH_IRR[3].irr,25],[BENCH_IRR[2].irr,50],[BENCH_IRR[1].irr,75],[BENCH_IRR[0].irr,90],[0.45,99]];
  if(irr<=pts[0][0]) return 1; if(irr>=pts[5][0]) return 99;
  for(let i=1;i<pts.length;i++) if(irr<=pts[i][0]){const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; return Math.round(y0+(y1-y0)*(irr-x0)/(x1-x0));}
}
function shareLink(){
  const R=G.result, base=location.href.split('#')[0];
  const h=new URLSearchParams({seed:G.seed,diff:G.diff,mode:G.mode,thesis:G.thesis,gp:String(G.gpPct),beat:R.tvpi.toFixed(2),from:G.fundName});
  return base+'#'+h.toString();
}
function shareText(){
  const R=G.result, pc=irrPercentile(R.netIrr);
  return `I ran ${G.fundName} in Power Law Fund: ${fmtX(R.tvpi)} net TVPI${R.netIrr!=null?`, ${pct(R.netIrr,1)} net IRR`:''}${pc!=null?` (better than ~${pc}% of real VC funds)`:''}. Same market, same deals: seed ${G.seed}, ${MODES[G.mode].label}, ${G.D.label}, ${G.thesis} thesis. Can you beat it?`;
}

      :`<p class="eyebrow">The power law</p><h2>No investments</h2><p class="wline">You never deployed capital.</p>`,

      <p class="wline">You earned <b>${fmt$(R.carry)}</b> in carry${R.clawback>0?` after giving back ${fmt$(R.clawback)} in clawback`:''}${R.gpCommit?`, and your ${fmt$(R.gpCommit)} commitment became ${fmt$(R.gpCommitValue)}`:''}.</p>`,
    `<p class="eyebrow">Portfolio construction</p><h2>How you built it</h2>
      <div class="wgrid">${big(owned.length,'companies')}${big(exited.length,'exits')}${big(dead.length,'shut down')}${big(closed?pct(wins/closed,0):'—','of closed deals returned cost')}</div>
      <div class="wsplit"><span style="width:${(initial/(R.invested||1)*100).toFixed(1)}%">New checks ${pct(initial/(R.invested||1),0)}</span><span class="f">Follow-ons ${pct(follow/(R.invested||1),0)}</span></div>

    `<p class="eyebrow">Against the market</p><h2>${R.netIrr!=null&&R.netIrr>=SP500_10Y?'You beat the index':'An index fund would have done better'}</h2>

function benchSection(R){
  const me=R.netIrr, hi=Math.max(0.35,(me||0)+0.03), lo=Math.min(0,(me||0)-0.03), w=v=>((v-lo)/(hi-lo)*100).toFixed(1);
  const rows=[...BENCH_IRR.map(b=>({l:b.label,sub:b.sub,v:b.irr,cls:'bm'})),{l:'S&P 500',sub:'10-yr annualized',v:SP500_10Y,cls:'sp'},{l:esc(G.fundName),sub:'your net IRR',v:me,cls:'me'}]
    .filter(r=>r.v!=null).sort((a,b)=>b.v-a.v);
  const owned=G.companies.filter(c=>c.owned), n=owned.length||1;
  const mult=c=>valueOf(c)/c.invested;
  const mine=[owned.filter(c=>mult(c)<0.05).length,owned.filter(c=>mult(c)>=0.05&&mult(c)<1).length,owned.filter(c=>mult(c)>=1&&mult(c)<3).length,owned.filter(c=>mult(c)>=3).length];
  return `<section style="display:grid;gap:12px"><h2>How you compare</h2>
    <div class="mk">
      <div class="card" style="padding:14px 16px;display:grid;gap:10px"><p class="eyebrow">Net IRR vs. real venture funds</p>
        <div class="bars">${rows.map(r=>`<div class="barrow bm-row ${r.cls}"><span>${r.l}<small>${r.sub}</small></span><span class="bartrack"><i style="margin-left:${r.v<0?w(r.v):w(0)}%;width:${Math.abs(w(r.v)-w(0)).toFixed(1)}%"></i></span><span class="n">${pct(r.v,1)}</span></div>`).join('')}</div>
        <p class="muted" style="font-size:.78rem">${BENCH_IRR_SRC} All VC figures net of fees, expenses and carry.</p></div>

        <div class="tablewrap" style="border:0"><table><thead><tr><th>Outcome</th><th class="n">Your fund</th><th class="n">Typical</th></tr></thead><tbody>
          ${BENCH_MIX.map(([l,t],i)=>`<tr><td>${l}</td><td class="n">${pct(mine[i]/n,0)} · ${mine[i]}</td><td class="n">${pct(t,0)}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="muted" style="font-size:.82rem">In a typical fund, ${pct(BENCH_MIX[0][1]+BENCH_MIX[1][1],0)} of deals fail to return their cost and 1–3 investments drive 50–80% of returns. Unrealized companies are counted at their year-10 marks.</p>
        <p class="muted" style="font-size:.78rem">${BENCH_MIX_SRC}</p></div>
    </div></section>`;
}

        <div class="card" style="padding:14px 16px;display:grid;gap:8px"><p class="eyebrow">Your economics as GP</p>

  if(!G.over&&!G.modal&&G.lessonQ&&G.lessonQ.length){ const L=G.lessonQ[0], C=LESSONS[L.key](L.d); G.lessonLog=G.lessonLog||{}; G.lessonLog[L.key]={t:C.t,b:C.b,qq:C.q,q:L.q,f:C.f}; G.modal={type:'lesson'}; }
  if(G.over){ app.innerHTML=renderEnd()+renderModal(); return; }
  const nOwn=G.companies.filter(c=>c.owned&&(c.status==='alive'||c.status==='bridge')).length;
  const alerts=G.pending.length+G.companies.filter(c=>c.owned&&c.status==='alive'&&c.crisis).length;
  const tabs=[['deals',G.q<INVEST_QS?'Pitch day':'Deal flow',G.q<INVEST_QS?waitingFounders():0,false],['port','Portfolio',alerts||nOwn,alerts>0],['net','Network',0,false],['fund','LP view',0,false],['market','Market',0,false],['log','Notebook',G.lessonQ?0:0,false]];
  const views={deals:renderDeals,port:renderPortfolio,net:renderNetwork,fund:renderFund,market:renderMarket,log:renderNotebook};
  const showRecap=false;
  app.innerHTML=renderHeader()+`<main class="wrap game">${showRecap?renderRecap():''}
    <nav class="tabs" role="tablist">${tabs.map(([k,l,n,a])=>`<button class="tab ${G.tab===k?'on':''}" role="tab" aria-selected="${G.tab===k}" data-act="tab" data-k="${k}">${l}${n?`<span class="count ${a?'alert':''}">${n}</span>`:''}</button>`).join('')}</nav>
    ${views[G.tab]()}</main>`+renderModal();
  G.fx=null; G.toast=null;
  hudDeltas();
}

function waitingFounders(){ return G.q<INVEST_QS?G.deals.filter(id=>undecided(byId(id))).length:0; }
const BADGES=[
  {id:'first',name:'First check',d:'Wrote your first check.',t:()=>G.companies.some(c=>c.owned)},
  {id:'early',name:'Early bird',d:'Got into a hot round at the first-close cap.',t:()=>G.companies.some(c=>c.owned&&c.terms&&c.terms.heat==='hot'&&c.entryCap&&c.entryCap<=c.terms.tr[0].cap*1.001)},
  {id:'neg',name:'Negotiator',d:'A founder accepted your lower cap.',t:()=>G.companies.some(c=>c.negCap)},
  {id:'patient',name:'Patient money',d:'Waited out a cold round and came back cheaper.',t:()=>G.companies.some(c=>c.waited&&c.owned)},
  {id:'ten',name:'Ten-bagger',d:'An exit returned 10x or more.',t:()=>G.companies.some(c=>c.owned&&c.status==='exited'&&c.returned>=10*c.invested)},
  {id:'returner',name:'Fund returner',d:'One company is worth more than the whole $50M fund.',t:()=>G.companies.some(c=>c.owned&&valueOf(c)>=FUND)},
  {id:'comeback',name:'Comeback',d:'A company you bridged later exited above cost.',t:()=>G.companies.some(c=>c.owned&&c.bridges>0&&c.status==='exited'&&c.returned>=c.invested)},
  {id:'trusted',name:'Trusted partner',d:'Reached Trusted with a co-investor fund.',t:()=>FUNDS.some(f=>G.rel[f.id]>=80)},
  {id:'fav',name:'Founders\u2019 favorite',d:'Founder reputation of 75 or more.',t:()=>G.rep>=75},
  {id:'dpi',name:'Money back',d:'LPs have received more cash than they paid in (DPI above 1x).',t:()=>{const S=settle();return S.paidIn>0&&G.lp.dist>=S.paidIn;}},
  {id:'scholar',name:'Scholar',d:'Met ten teaching moments.',t:()=>G.lessonsSeen.length>=10},
];
function checkBadges(){
  if(!G) return; G.badges=G.badges||[];
  for(const b of BADGES){ if(G.badges.includes(b.id)) continue; let ok=false; try{ ok=b.t(); }catch(e){}
    if(ok){ G.badges.push(b.id); flashBadge(b); } }
}
function flashBadge(b){
  const el=document.createElement('div'); el.className='badge-toast'; el.setAttribute('role','status');
  el.innerHTML=`<span class="bt-medal" aria-hidden="true">★</span><span><small>Achievement</small><b>${b.name}</b><em>${b.d}</em></span>`;
  document.body.appendChild(el); setTimeout(()=>el.remove(),4200);
}
function showEvents(){ if(!G) return; if(G.over){ G.modal={type:'wrap',i:0}; return; } if(G.turn){ G.modal={type:'turn'}; return; } if(G.events.length) G.modal={type:'events',i:0}; }
function markTurn(pq,pr){ if(G&&!G.over) G.turn={pq,pr}; }
const ACT={
  pickDiff:d=>{START.diff=d.k},
  pickGp:d=>{START.gp=+(d.k??d.p)},
  newSeed:()=>{START.seed=randomSeed()},
  start:()=>{ newGame({...START,seed:(START.seed||randomSeed()).trim()}); startQuarterUI(); if(START.tutorial) G.modal={type:'tut',i:0}; window.scrollTo(0,0); },
  openTut:()=>{ G.modal={type:'tut',i:0}; },
  tutGo:d=>{ const n=tutSteps().length; G.modal.i=Math.max(0,Math.min(n-1,G.modal.i+(+d.d))); },
  tutClose:()=>{ G.modal=null; },
  toggleTut:()=>{START.tutorial=!START.tutorial},
  tab:d=>{G.tab=d.k},
  openCall:d=>{G.modal={type:'call',cid:+d.id,picked:[]}},
  pickQ:d=>{const p=G.modal.picked,i=p.indexOf(d.k); if(i>=0)p.splice(i,1); else if(p.length<QPERCALL)p.push(d.k);},
  runCall:()=>{const M=G.modal; M.lines=runCall(M.cid,M.picked)},
  openInvest:d=>{const c=byId(+d.id); const opts=checkOptions(c); G.modal={type:'invest',cid:c.id,choice:Math.max(0,opts.findIndex(o=>o.ok))}},
  pickCheck:d=>{G.modal.choice=+d.i},
  confirmInvest:()=>{const M=G.modal,c=byId(M.cid),o=checkOptions(c)[M.choice]; G.modal=null; if(o&&o.ok){ invest(c.id,o.amt); if(G.tab==='deals'&&G.stage==='pitch'&&G.deals[G.pitch]===c.id){ G.fx={t:'fund',id:c.id}; G.toast=reaction(c,'fund'); advancePitch(); } } },
  close:()=>{G.modal=null},
  overlay:(d,el,e)=>{ if(e.target===el){ if(G.modal&&G.modal.type==='lesson') G.lessonQ.shift(); G.modal=null; } },
  decide:d=>decide(d.p,d.c),
  sup:d=>doSupport(+d.id,d.k),
  end:()=>{ if(G.pending.length||waitingFounders()){G.modal={type:'confirmEnd'};return;} const pq=G.q,pr=G.regime; endQuarter(); markTurn(pq,pr); startQuarterUI(); showEvents(); window.scrollTo(0,0); },
  forceEnd:()=>{ G.modal=null; const pq=G.q,pr=G.regime; endQuarter(); markTurn(pq,pr); startQuarterUI(); showEvents(); window.scrollTo(0,0); },
  skip:()=>{ if(G.pending.length){G.modal={type:'confirmEnd'};return;} const pq=G.q,pr=G.regime; skipAhead(); markTurn(pq,pr); startQuarterUI(); showEvents(); window.scrollTo(0,0); },
  evNext:()=>{ const M=G.modal; if(M.i<G.events.length-1) M.i++; else G.modal=null; },
  evSkip:()=>{ G.modal=null; },
  turnGo:()=>{ G.turn=null; G.modal=null; showEvents(); },
  lessonOk:()=>{ G.lessonQ.shift(); G.modal=null; },
  pickMode:d=>{START.mode=d.k},
  toggleTeach:()=>{START.teach=!START.teach},
  startPitches:()=>{ const f=byId(G.deals[0]); if(f&&f.terms) teach('ownership',{name:f.name,cap:f.terms.tr[0].cap}); G.stage='pitch'; G.pitch=Math.max(0,G.deals.findIndex(id=>undecided(byId(id)))); G.fx={t:'enter'}; window.scrollTo(0,0); },
  passDeal:d=>{ const c=byId(+d.id); passDeal(c.id,d.ref); G.toast=reaction(c,d.ref?'refer':'pass',d.ref?FUND_BY[d.ref].name:''); G.fx={t:'pass',id:c.id}; advancePitch(); window.scrollTo(0,0); },
  nextPitch:()=>{ const c=byId(G.deals[G.pitch]); if(c&&c.pitch==='lost'){ G.toast=reaction(c,'lost',c.lead?FUND_BY[c.lead].short:'Another fund'); G.fx={t:'lost',id:c.id}; } else G.fx={t:'enter'}; advancePitch(); window.scrollTo(0,0); },
  waitDeal:d=>{ const c=byId(+d.id); waitDeal(c.id); G.fx={t:'enter'}; advancePitch(); },
  openNeg:d=>{ G.modal={type:'neg',cid:+d.id}; },
  negotiate:d=>{ const r=negotiate(G.modal.cid,+d.disc); if(r) G.modal.result=r; },
  coffee:d=>coffee(d.f),
  gotoPitch:d=>{ G.stage='pitch'; G.pitch=+d.i; G.fx={t:'enter'}; },
  wrapGo:d=>{ const M=G.modal; M.i=Math.max(0,Math.min(5,M.i+(+d.d))); },
  openWrap:d=>{ G.modal={type:'wrap',i:+(d.i||0)}; },
  copyShare:()=>{ const t=shareText()+' '+shareLink(); try{ navigator.clipboard.writeText(t).then(()=>{G.modal.copied=true;render();},()=>prompt('Copy this challenge:',t)); }catch(e){ prompt('Copy this challenge:',t); } },
  nativeShare:()=>{ try{ navigator.share({title:'Power Law Fund challenge',text:shareText(),url:shareLink()}).catch(()=>{}); }catch(e){} },
  askRestart:()=>{G.modal={type:'restart'}},
  restart:()=>{ G=null; START.seed=randomSeed(); window.scrollTo(0,0); },
  replay:()=>{ const o={fund:G.fundName,diff:G.diff,mode:G.mode,teach:G.teach,thesis:G.thesis,gp:G.gpPct,seed:G.seed}; newGame(o); startQuarterUI(); window.scrollTo(0,0); },
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=ACT[el.dataset.act]; if(!fn) return;
  if(el.dataset.act==='overlay'&&e.target!==el) return;
  fn(el.dataset,el,e); render(); checkBadges();
});
document.addEventListener('input',e=>{
  if(e.target.id==='fundName') START.fund=e.target.value;
  if(e.target.id==='seedInput') START.seed=e.target.value;
});
document.addEventListener('change',e=>{ if(e.target.id==='thesisSel') START.thesis=e.target.value; });
document.addEventListener('keydown',e=>{
  if(G&&G.modal&&G.modal.type==='tut'){ if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); if(G.modal.i>=tutSteps().length-1) ACT.tutClose(); else ACT.tutGo({d:1}); render(); return; } if(e.key==='ArrowLeft'){ ACT.tutGo({d:-1}); render(); return; } if(e.key==='Escape'){ ACT.tutClose(); render(); return; } }
  if(e.key==='?'&&G&&!G.over&&!G.modal&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName)){ ACT.openTut(); render(); return; }
  if(e.key==='Enter'&&G&&G.modal&&G.modal.type==='turn'){ e.preventDefault(); ACT.turnGo(); render(); return; }
  if(e.key==='Escape'&&G&&G.modal&&G.modal.type==='turn'){ ACT.turnGo(); render(); return; }
  if(e.key==='Escape'&&G&&G.modal){ if(G.modal.type==='lesson') G.lessonQ.shift(); G.modal=null;render();}
  if(G&&G.modal&&G.modal.type==='wrap'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){ ACT.wrapGo({d:e.key==='ArrowRight'?1:-1}); render(); }
  if(!G||G.modal||G.over||G.tab!=='deals'||G.q>=INVEST_QS||e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName)) return;
  const k=e.key.toLowerCase();
  if(G.stage==='intro'&&k==='enter'){ e.preventDefault(); ACT.startPitches(); render(); return; }
  if(G.stage!=='pitch') return;
  const c=byId(G.deals[G.pitch]); if(!c||c.owned) return;
  if(c.pitch) return;
  if(k==='p'){ ACT.passDeal({id:c.id}); render(); }
  else if(k==='r'&&!c.pitch&&referTarget(c)){ ACT.passDeal({id:c.id,ref:referTarget(c).id}); render(); }
  else if(k==='d'&&G.calls>0&&!c.pitch){ ACT.openCall({id:c.id}); render(); }
  else if(k==='i'&&G.cash>0){ ACT.openInvest({id:c.id}); render(); }
});
// A challenge link carries the seed and settings in the URL hash, so a friend plays the same fund.
(function readChallenge(){
  try{
    const h=new URLSearchParams(location.hash.slice(1));
    const seed=(h.get('seed')||'').replace(/[^0-9a-zA-Z]/g,'').slice(0,12); if(!seed) return;
    START.seed=seed;
    if(DIFFS[h.get('diff')]) START.diff=h.get('diff');
    if(MODES[h.get('mode')]) START.mode=h.get('mode');
    if(['Generalist',...SECTORS].includes(h.get('thesis'))) START.thesis=h.get('thesis');
    if(GP_OPTS.includes(+h.get('gp'))) START.gp=+h.get('gp');
    const beat=parseFloat(h.get('beat')); if(beat>0&&beat<1000) START.challenge={beat, from:(h.get('from')||'A friend').slice(0,28)};
  }catch(e){}
})();
render();
</script>
