<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Power Law Fund</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a partner's desk. Sticky fund ticker on top, tabbed workspace below; deals are memo cards, portfolio is a ledger. */
:root{
  --paper:#ECEFF3; --card:#FFFFFF; --ink:#141E28; --muted:#5A6774; --line:#D3DAE2;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E2E9FB; --band:#C3D1F7;
  --good:#17804F; --good-soft:#DDF2E7; --warn:#A0630E; --warn-soft:#F7EBD4; --bad:#BF3B33; --bad-soft:#F8E0DE;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  --f-display:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1319; --card:#151D26; --ink:#E2E8EE; --muted:#8C98A5; --line:#27323E;
  --accent:#86A2FF; --accent-ink:#0D1319; --accent-soft:#1B2747; --band:#2C3D6E;
  --good:#4CC38A; --good-soft:#123326; --warn:#E3AA45; --warn-soft:#3A2A10; --bad:#F2766D; --bad-soft:#3D1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1319; --card:#151D26; --ink:#E2E8EE; --muted:#8C98A5; --line:#27323E;
  --accent:#86A2FF; --accent-ink:#0D1319; --accent-soft:#1B2747; --band:#2C3D6E;
  --good:#4CC38A; --good-soft:#123326; --warn:#E3AA45; --warn-soft:#3A2A10; --bad:#F2766D; --bad-soft:#3D1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:1.45rem;font-stretch:85%;font-weight:750}
h3{font-size:1.2rem;font-stretch:90%;font-weight:700}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.5rem .85rem;font-weight:600;font-size:.88rem}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.small{padding:.32rem .6rem;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;width:100%}
label.f{display:grid;gap:.35rem;font-size:.82rem;font-weight:600;color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:600;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip-acc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip-good{border-color:transparent;background:var(--good-soft);color:var(--good)}
.chip-warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip-bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* ---------- Start screen ---------- */
.start{padding-block:48px 64px;display:grid;gap:36px}
.start{grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.start{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);column-gap:48px;align-items:start}.start .how,.start .srcs{grid-column:1/-1}.hero{position:sticky;top:24px}}
.hero{display:grid;gap:16px;align-content:start}
.lockup{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:80%;font-weight:850;font-size:1.5rem;letter-spacing:-.01em}
.hero-h{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:clamp(2rem,4.4vw,3.1rem);line-height:1.05;letter-spacing:-.015em;max-width:18ch}
.proof{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:58ch}
.proof li{position:relative;padding-left:26px;font-size:.94rem;color:var(--muted)}
.proof li b{color:var(--ink)}
.proof li::before{content:"";position:absolute;left:0;top:.3em;width:14px;height:14px;border-radius:4px;background:var(--accent-soft);border:1.5px solid var(--accent)}
.curve .axis{stroke:var(--line);stroke-width:1}
.byline{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;max-width:58ch}
.logo{width:22px;height:22px;flex:0 0 auto;vertical-align:-4px}
.logo.xl{width:40px;height:40px}
.logo .lg-bg{fill:var(--accent)}
.logo .lg-curve{fill:none;stroke:var(--accent-ink);stroke-width:2.6;stroke-linecap:round}
.logo .lg-dot{fill:var(--accent-ink)}
.setup h2{font-size:1.35rem}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.sn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.sb{display:grid;gap:8px;min-width:0}
.sb h3{font-size:.98rem}
.hint{font-size:.83rem;color:var(--muted);line-height:1.45}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--paper)}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:7px;padding:.5rem .7rem;font-size:.86rem;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,40,.12),inset 0 0 0 1px var(--line)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.terms-chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:14px;border-top:1px solid var(--line)}
.terms-chips{position:relative}
.tip{position:static;display:inline-block}
.terms-chips .tip-btn{font:inherit;font-size:.74rem;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--paper);border:1px solid var(--line);color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.terms-chips .tip-btn:hover,.terms-chips .tip-btn:focus-visible,.tip:focus-within .tip-btn{color:var(--ink);border-color:var(--accent)}
.tip-pop{display:none;position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);max-width:440px;padding:10px 12px;border-radius:6px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(15,25,35,.16);font-size:.83rem;line-height:1.45;color:var(--ink);font-weight:400;text-align:left}
.tip-pop b{display:block;margin-bottom:3px;font-size:.85rem}
.tip:hover .tip-pop,.tip:focus-within .tip-pop{display:block}
.terms-chips span.tip-x{font-family:var(--f-mono);font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.cta{width:100%;justify-content:center}
.how .hn{font-family:var(--f-display);font-weight:800;font-size:1.02rem}
.srcs{font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.brand span{color:var(--accent)}
.lede{max-width:62ch;font-size:1.08rem;margin-top:14px;color:var(--ink)}
.curve{width:100%;max-width:520px;height:auto;margin-top:18px}
.curve path.fill{fill:var(--accent-soft)} .curve path.line{fill:none;stroke:var(--accent);stroke-width:2.5}
.curve text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.setup{padding:22px;display:grid;gap:18px}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:10px}
.diff{text-align:left;display:grid;gap:4px;padding:14px;border-radius:10px;font-weight:400}
.diff b{font-family:var(--f-display);font-stretch:85%;font-size:1.1rem}
.diff small{color:var(--muted);font-size:.82rem;line-height:1.4}
.gpopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:8px;margin-top:4px}
.gpopt{text-align:left;display:grid;gap:2px;padding:10px 12px;border-radius:10px;font-weight:400}
.gpopt b{font-family:var(--f-mono)}
.gpopt small{color:var(--muted);font-size:.76rem}
.gpopt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.diff.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:20px}
.how div{display:grid;gap:6px;align-content:start;border-top:2px solid var(--ink);padding-top:10px}
.how h3{font-size:1.05rem}
.how p{color:var(--muted);font-size:.9rem}
.seedrow{display:flex;gap:8px}
.seedrow input{flex:1;min-width:0}

/* ---------- Header ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px}
.fund b{font-family:var(--f-display);font-stretch:75%;font-weight:850;font-size:1.35rem;text-transform:uppercase;display:block;line-height:1}
.fund span{font-size:.75rem;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;flex:1;min-width:0}
.stat{display:grid;line-height:1.15}
.stat small{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat span{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.timeline{display:grid;grid-template-columns:repeat(40,1fr);gap:2px;padding-block:0 8px}
.timeline i{height:5px;border-radius:2px;background:var(--line)}
.timeline i.inv{background:var(--band)}
.timeline i.past{background:var(--muted)}
.timeline i.now{background:var(--accent)}
.reg{font-weight:700}
.reg-boom{color:var(--good)} .reg-normal{color:var(--accent)} .reg-correction{color:var(--warn)} .reg-recession{color:var(--bad)}

/* ---------- Main ---------- */
main.game{padding-block:20px 60px;display:grid;gap:18px}
.recap{padding:14px 16px;display:grid;gap:8px}
.recap ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.recap li{font-size:.9rem;padding-left:14px;position:relative}
.recap li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.recap li.good::before{background:var(--good)} .recap li.bad::before{background:var(--bad)} .recap li.warn::before{background:var(--warn)} .recap li.info::before{background:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:.6rem .9rem;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:.75rem;margin-left:4px;background:var(--accent-soft);color:var(--accent);padding:0 .4rem;border-radius:999px}
.tab .count.alert{background:var(--bad);color:#fff}
.section-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px}
.section-h p{color:var(--muted);font-size:.88rem;max-width:70ch}

.deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:16px;align-items:start}
.deal{padding:16px;display:grid;gap:12px;min-width:0}
.deal.is-owned{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.deal-h{display:grid;gap:6px}
.deal-h .chips{display:flex;flex-wrap:wrap;gap:4px}
.one{font-size:.9rem}
.founder{font-size:.8rem;color:var(--muted)}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin:0;padding:10px 0;border-block:1px dashed var(--line)}
.terms div{min-width:0}
.terms dt{font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.terms dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:.86rem;overflow-wrap:anywhere}
.meters{display:grid;gap:7px;margin-top:8px}
.dsec{display:grid;gap:4px;padding-top:10px;border-top:1px dashed var(--line)}
.dsec h4{margin:0;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dsec dl{margin:0;display:grid;gap:3px}
.dsec dl div{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:.86rem}
.dsec dl div[title]{cursor:help}
.dsec dt{color:var(--ink)}
.dsec dl div[title] dt{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.dsec dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;text-align:right;overflow-wrap:anywhere}
.dsec dd s{color:var(--bad);font-weight:400;margin-left:4px}
.dsec .ask{font-family:var(--f-body,inherit);font-weight:400;font-style:italic;color:var(--muted);font-size:.8rem}
.dsec .tag{font-family:var(--f-mono);font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 4px;vertical-align:1px}
.dsec .tag.n{color:var(--muted);background:var(--paper)}
.legend-line{font-size:.8rem;color:var(--muted);margin-top:6px}
.legend-line .tag{font-family:var(--f-mono);font-size:.62rem;font-weight:600;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 4px}
.scores summary{font-size:.82rem;font-weight:600;cursor:pointer}
.scores summary .muted{font-weight:400}
.meter{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 4.6rem;align-items:center;gap:8px;font-size:.8rem}
.m-track{position:relative;height:8px;background:var(--paper);border-radius:4px;border:1px solid var(--line)}
.m-band{position:absolute;top:-1px;bottom:-1px;background:var(--band);border-radius:4px}
.m-dot{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink);border:2px solid var(--card)}
.m-val{font-family:var(--f-mono);font-size:.78rem;text-align:right;white-space:nowrap}
.m-val i{font-style:normal;color:var(--good);font-family:var(--f-body);font-size:.66rem;font-weight:700;margin-left:3px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--paper);border-radius:8px;padding:10px}
.facts div{display:grid;min-width:0}
.facts small{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.facts span{font-family:var(--f-mono);font-size:.8rem;font-weight:600;overflow-wrap:anywhere}
.flags{display:grid;gap:5px}
.flag{font-size:.8rem;padding:6px 9px;border-radius:7px;background:var(--bad-soft);color:var(--bad)}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag b{font-weight:700}
.deal-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deal-f .note{font-size:.8rem;color:var(--muted)}
.owned-note{font-size:.85rem;color:var(--good);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Portfolio */
.decisions{display:grid;gap:12px}
.decision{padding:14px 16px;display:grid;gap:10px;border-left:4px solid var(--accent)}
.decision.bridge{border-left-color:var(--bad)}
.decision .row{display:flex;flex-wrap:wrap;gap:8px}
.port{display:grid;gap:10px}
.glance{display:grid;gap:8px}
.glance-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.glance-h p{font-size:.85rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,46%),1fr));gap:8px}
.tile{position:relative;display:grid;gap:1px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;color:var(--ink);text-decoration:none;min-width:0}
a.tile:hover{border-color:var(--accent);border-left-color:inherit}
.tile b{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tx{font-family:var(--f-mono);font-weight:600;font-size:.95rem}
.tile.done{background:var(--paper)}
a.tile .tx{color:var(--ink)!important}
.tile.done b{color:var(--muted)}
.t-good{border-left-color:var(--good)} .t-good .tx{color:var(--good)}
.t-acc{border-left-color:var(--accent)} .t-acc .tx{color:var(--accent)}
.t-warn{border-left-color:var(--warn)} .t-warn .tx{color:var(--warn)}
.t-bad{border-left-color:var(--bad)} .t-bad .tx{color:var(--bad)}
.tile .needs{position:absolute;top:6px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#fff;font-style:normal;font-weight:700;font-size:.75rem;display:grid;place-items:center}
.pc{scroll-margin-top:150px}
.pc{padding:14px 16px;display:grid;gap:10px;min-width:0}
.pc-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.pc-name{display:grid;min-width:min(200px,100%);flex:1}
.pc-name b{font-family:var(--f-display);font-stretch:90%;font-size:1.1rem}
.pc-name small{color:var(--muted);font-size:.78rem}
.kv{display:grid;line-height:1.2}
.kv small{font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv span{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:.88rem}
.crisis{font-size:.85rem;background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:8px}
.sup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sup .lbl{font-size:.75rem;color:var(--muted);margin-right:4px}
.sup button.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* Market */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .rate{fill:none;stroke:var(--ink);stroke-width:2}
.chart .dot{fill:var(--ink)}
.chart .zero{stroke:var(--muted);stroke-width:1.2}
.chart .jc-area{fill:var(--accent-soft);opacity:.8}

  recruit:{label:'Recruiting help', hours:2, tip:'Intro senior candidates. Fixes a poached hire.'},
  intros: {label:'Customer intros', hours:2, tip:'Open doors to buyers. Fixes a lost customer.'},
  prep:   {label:'Fundraising prep', hours:3, tip:'Boosts the odds of the next round closing.'},
  board:  {label:'Board session', hours:3, tip:'Work through hard decisions. Fixes cofounder conflict.'},
};
const QUESTIONS = [
  ['burn','What is your monthly burn?'],

  ['growth','How fast is revenue growing?'],
  ['cash','How much cash is in the bank?'],
  ['lois','Any signed LOIs or paid pilots?'],

const QTEXT = Object.fromEntries(QUESTIONS);
const QPERCALL = 3;

// Co-investor network. Fictional funds; each leads certain stages and can refer deals.
// thr: relationship needed before they share deals; boost: how much better their referrals are.
const FUNDS = [
  {id:'ridgeback', name:'Ridgeback Seed', short:'Ridgeback', style:'Scrappy pre-seed shop that sees everything early and shares freely.', leads:[0], refers:true, thr:30, freq:0.25, boost:0.25, start:30},
  {id:'tidewell', name:'Tidewell Ventures', short:'Tidewell', style:'Seed generalist with a big network. Friendly, and loyal to funds that return the favor.', leads:[1], refers:true, thr:35, freq:0.22, boost:0.45, start:40},
  {id:'larchmere', name:'Larchmere Partners', short:'Larchmere', style:'Top-tier Series A firm. Shares its best deals only with funds it trusts.', leads:[2,3], refers:true, thr:60, freq:0.2, boost:1.0, start:15},

const relTier = v => v>=80?'Trusted':v>=60?'Close':v>=35?'Warm':'Cold';
const REP_TIER = v => v>=75?'Founders seek you out':v>=60?'Well regarded':v>=40?'Neutral':v>=25?'Mixed reviews':'Founders warn each other';

// Outcome calibration. Tuned with a batch simulator so a typical portfolio lands near the
// Correlation Ventures outcome mix and typical play lands near the Carta median net IRR.
const CAL = {
  raiseBase:0.05,                 // baseline odds of closing the next round
  stepBase:0.02, stepM:0.42,      // step-up between rounds (log scale) and momentum sensitivity
  exitBase:0.15, exitM:0.2,       // exit premium over last post-money
  brA:0.4, brM:1.0, brN:0.8,      // odds a bridge buys a real second chance: base, momentum, each prior bridge
  brDecl:0.25,                    // a major insider declining the bridge cuts those odds to this fraction
  earlyExit:0.012,                // quarterly odds a pre-Series B company gets acquired (scaled down if struggling)
  holdKeen:0.35, holdSells:0.8,   // momentum lost when the board turns down an offer (founder keen to build / founder wanted to sell)
  killShare:0.5,                  // failed bridges that shut down outright (the rest sell for parts)
};

// ---------------------------------------------------------------------------
// Random numbers. Separate seeded streams keep the market, the deal flow and
// each company's fate identical for everyone who plays the same seed.
// ---------------------------------------------------------------------------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^h>>>16)>>>0}
function gauss(r){const u=Math.max(r(),1e-9),v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sig=x=>1/(1+Math.exp(-x));
const pick=(arr,u)=>arr[Math.min(arr.length-1,Math.floor(u*arr.length))];

let G = null;

function newGame(o){
  const D = DIFFS[o.diff], MODE = MODES[o.mode]||MODES.class;
  INVEST_QS = MODE.invest; DEALS_PER_Q = MODE.deals;
  const gpPct = GP_OPTS.includes(+o.gp) ? +o.gp : 0.01, gpCommit = FUND*gpPct, investable = FUND-FEES+gpCommit;
  G = {
    seed:String(o.seed), diff:o.diff, D, thesis:o.thesis, fundName:o.fund||'Fund I',
    gpPct, gpCommit, gpKept:GP_WEALTH-gpCommit, investable, gpShare:gpCommit/investable,
    lp:{called:0, fees:0, dist:0}, gp:{called:0, dist:0, carry:0}, lpFlows:[], hist:[],
    mode:MODES[o.mode]?o.mode:'class', teach:o.teach!==false, lessonsSeen:[], lessonQ:[],
    q:0, cash:investable, calls:Math.round(D.calls*MODE.callMult), hours:D.hours,
    rate:D.rate, regime:D.start, rateHist:[D.rate], regimeHist:[D.start], shocks:[],
    marketRng:mulberry32(hashStr(o.seed+'|market')), dealRng:mulberry32(hashStr(o.seed+'|deals')), refRng:mulberry32(hashStr(o.seed+'|refs')),
    rel:Object.fromEntries(FUNDS.map(f=>[f.id,f.start])), rep:50, coffee:{}, relLog:[],
    companies:[], deals:[], pending:[], log:[], recap:[], flows:[], distributed:0, nextId:1, usedNames:{},
    over:false, tab:'deals', modal:null, events:[],
  };
  addLog(`${G.fundName} closed with $50M from LPs${gpCommit?` and a ${fmt$(gpCommit)} GP commitment`:''}. Over ten years, $10M of LP money goes to the 2% management fee, leaving ${fmt$(investable)} to invest.`,'info');
  chargeFee();
  genDeals();
}

// ---------------------------------------------------------------------------
// Fund accounting: capital calls, fees, and the American (deal-by-deal) waterfall.
// G.flows tracks gross deal cash flows; G.lpFlows tracks what LPs actually pay in and get back.
// ---------------------------------------------------------------------------
function chargeFee(){ G.lp.fees+=FEE_Q; G.lpFlows.push({q:G.q,amt:-FEE_Q}); }
function deploy(c,amt,price=c.post){
  // Every dollar invested is called pro rata from LPs and the GP.
  G.cash-=amt; c.invested+=amt; c.own+=amt/price; G.flows.push({q:G.q,amt:-amt});
  const gp=amt*G.gpShare, lp=amt-gp;
  G.lp.called+=lp; G.gp.called+=gp; G.lpFlows.push({q:G.q,amt:-lp});
}
function distribute(c){
  // Proceeds split pro rata. The GP's own commitment pays no carry. On the LP share, the
  // GP takes 20% of this deal's profit as soon as it exits: the American model.
  const P=c.returned, gpP=P*G.gpShare, lpP=P-gpP, lpCost=c.invested*(1-G.gpShare);
  const carry=CARRY*Math.max(0,lpP-lpCost), lpNet=lpP-carry;
  c.carry=carry; c.lpNet=lpNet; c.lpGross=lpP;
  G.lp.dist+=lpNet; G.gp.dist+=gpP; G.gp.carry+=carry;
  G.lpFlows.push({q:G.q+1,amt:lpNet});
  if(carry>0) teach('carry',{name:c.name,carry,profit:lpP-lpCost,fees:G.lp.fees});
  if(carry>0) addLog(`${c.name}: GP earned ${fmt$(carry)} in carry on this exit (20% of the LPs' ${fmt$(lpP-lpCost)} profit).`,'info');
}
// Settles the fund as if it liquidated at today's marks. The final settlement uses the same math.
function settle(){
  const g=G.gpShare, owned=G.companies.filter(c=>c.owned);
  const nav=owned.reduce((a,c)=>a+navOf(c),0), lpNav=nav*(1-g);
  // Carry the GP would be owed deal by deal on unrealized companies if they sold at their marks.
  const accruedDbd=owned.filter(c=>navOf(c)>0).reduce((a,c)=>a+CARRY*Math.max(0,(navOf(c)-c.invested)*(1-g)),0);
  const paidIn=G.lp.called+G.lp.fees;
  // Clawback: across the whole fund, the GP can keep at most 20% of LP profit after fees.
  const lpGrossTotal=G.lp.dist+G.gp.carry+lpNav;
  const fair=CARRY*Math.max(0,lpGrossTotal-paidIn);
  const entitled=Math.min(G.gp.carry+accruedDbd,fair);
  const clawback=Math.max(0,G.gp.carry-fair);
  const accrued=Math.max(0,entitled-G.gp.carry);
  const lpValue=G.lp.dist+clawback+lpNav-accrued;
  return {nav,lpNav,paidIn,fair,entitled,clawback,accrued,lpValue,
    tvpi:paidIn>0?lpValue/paidIn:0, dpi:paidIn>0?G.lp.dist/paidIn:0,
    carryNet:G.gp.carry-clawback+accrued};
}

function byId(id){return G.companies.find(c=>c.id===id)}
// Teaching moments: the first time a concept shows up in a student's own game, queue a short card.
function teach(key,d={}){ if(!G||!G.teach||G.lessonsSeen.includes(key)) return; G.lessonsSeen.push(key); G.lessonQ.push({key,q:G.q,d}); }
function addLog(text,t='info'){G.log.push({q:G.q,text,t})}
function rec(c,t,text){ if(!c||c.owned){ G.recap.push({t,text}); G.log.push({q:G.q,text,t}); } }
function qLabel(q){return `Y${Math.floor(q/4)+1} Q${q%4+1}`}

function genDeals(){
  for(let i=0;i<DEALS_PER_Q;i++){ const c=genCompany(); c.lead=leadFor(c); setTerms(c); G.companies.push(c); G.deals.push(c.id); }
  // Referrals come from a separate random stream, so the base deals on a seed are identical for every player.
  const rr=G.refRng, r1=rr(), r2=rr(), r3=rr();
  const elig=FUNDS.filter(f=>f.refers&&G.rel[f.id]>=f.thr).sort((a,b)=>(G.rel[b.id]-b.thr)-(G.rel[a.id]-a.thr));
  if(elig.length){ const f=elig[0]; if(r1<f.freq*(0.6+(G.rel[f.id]-f.thr)/50)){
    const c=genCompany(rr,f.boost); c.referredBy=f.id; c.lead=f.id; setTerms(c); G.companies.push(c); G.deals.push(c.id);
    addLog(`${f.name} brought you into ${c.name}, a deal they're leading.`,'good'); teach('network',{fund:f.name,name:c.name}); } }
  const port=G.companies.filter(c=>c.owned&&(c.status==='alive'||c.status==='bridge'));
  if(G.rep>=60&&port.length&&r2<(G.rep-50)/200){
    const c=genCompany(rr,0.5), by=pick(port,r3); c.referredBy='founder'; c.referrer=by.founder; c.lead=leadFor(c); setTerms(c); G.companies.push(c); G.deals.push(c.id);
    addLog(`${by.founder} of ${by.name} introduced you to ${c.founder} of ${c.name}.`,'good'); }
}
// Who is leading the round, if anyone. Deterministic per company so every player sees the same lead.
function leadFor(c){
  const u=hashStr(G.seed+'|lead|'+c.name)/4294967296;
  const f=FUNDS.find(f=>f.leads.includes(c.stage));
  return f&&u<[0.45,0.6,0.75][c.stage]?f.id:null;
}
const hotRound=c=>c.interest>0.68;
// A strong relationship with the lead, or a strong reputation with founders, gets you into hot rounds.
const hasAccess=c=>(c.lead&&G.rel[c.lead]>=60)||G.rep>=75;
const isExploding=c=>hotRound(c)&&!hasAccess(c)&&!c.owned;

// Round terms. Demand sets a schedule: the cap steps up as the round fills, and hot rounds close fast.
// Each diligence call takes about two weeks of that clock. A close relationship with the lead holds
// your allocation at the first-close cap.
const WEEKS_PER_CALL=2, QUARTER_WEEKS=12;
function setTerms(c){
  const h=c.interest, p=c.post; c.week=0;
  if(h>0.68) c.terms={tr:[{cap:p,until:2},{cap:p*1.4,until:4},{cap:p*2,until:6}],close:6,heat:'hot'};
  else if(h>0.42) c.terms={tr:[{cap:p,until:4},{cap:p*1.25,until:QUARTER_WEEKS}],close:Infinity,heat:'warm'};
  else c.terms={tr:[{cap:p,until:QUARTER_WEEKS}],close:Infinity,heat:'cold'};
}
const heldPrice=c=>c.terms.heat==='hot'&&hasAccess(c);
const closeWeek=c=>c.terms.heat==='hot'&&!hasAccess(c)?4:c.terms.close;
const roundClosed=c=>!c.owned&&c.week>=closeWeek(c);
function capAt(c,week){
  if(c.negCap) return c.negCap;
  if(heldPrice(c)) return c.terms.tr[0].cap;
  const t=c.terms.tr.find(t=>week<t.until)||c.terms.tr[c.terms.tr.length-1]; return t.cap;
}
const capNow=c=>roundClosed(c)?null:capAt(c,c.week);
function closeIfDone(c,why){ if(roundClosed(c)&&!c.pitch){ c.pitch='lost'; addLog(`${c.name}'s round closed ${why}.`,'bad'); } }
// Propose a lower cap. Only possible when nobody is leading the round. Odds depend on demand and reputation.
const negOdds=(c,disc)=>sig(3*(0.55-c.interest)+(G.rep-50)/20-8*(disc-0.1));
function negotiate(cid,disc){
  const c=byId(cid); if(!c||c.owned||c.lead||c.negotiated||roundClosed(c)) return null;
  const cur=capNow(c), p=negOdds(c,disc), ok=hashStr(G.seed+'|neg|'+c.name)/4294967296<p;
  c.negotiated=true; c.week+=1;
  if(ok){ c.negCap=cur*(1-disc); addLog(`${c.founder} agreed to a ${fmt$(c.negCap)} cap for you on ${c.name}, down from ${fmt$(cur)}.`,'good'); }
  else { addLog(`${c.founder} turned down a ${pct(disc,0)} lower cap on ${c.name}.`,'warn'); if(disc>=0.25) repChg(-1,`you lowballed ${c.founder}.`); }
  closeIfDone(c,'while you negotiated');
  return {ok,cur,disc};
}
// Cold rounds can be left open: the company may come back next quarter at a lower cap, or fill without you.
function waitDeal(cid){ const c=byId(cid); if(!c||c.owned||c.terms.heat!=='cold'||c.waited) return; c.pitch='waiting'; c.waitStage=c.stage; c.waitM=c.m; }
function requeueWaiting(){
  for(const c of G.companies){ if(c.pitch!=='waiting') continue;
    if(c.status!=='alive'||c.owned){ c.pitch='passed'; continue; }
    if(c.stage!==c.waitStage||c.m>c.waitM+0.15){ c.pitch='passed'; rec(null,'warn',`${c.name}'s round filled while you waited.`); continue; }
    const cut=c.m<c.waitM-0.15?0.7:0.85, cap=c.terms.tr[0].cap*cut;
    c.terms={tr:[{cap,until:QUARTER_WEEKS}],close:Infinity,heat:'cold'}; c.week=0; c.pitch=undefined; c.waited=true; c.negotiated=false; c.negCap=null;
    G.deals.push(c.id); rec(null,'good',`${c.name} is still raising, now at a ${fmt$(cap)} cap (${pct(1-cut,0)} lower).`);
  }
}
function relChg(fid,d,why){ if(!fid||!FUND_BY[fid]) return; const v=G.rel[fid]; G.rel[fid]=clamp(v+d,0,100);
  if(why){ G.relLog.push({q:G.q,fid,d,why}); addLog(`${FUND_BY[fid].short} ${d>0?'+':''}${d}: ${why}`,d>0?'good':'bad'); }
  const t0=relTier(v),t1=relTier(G.rel[fid]); if(t0!==t1) rec(null,d>0?'good':'bad',`Your relationship with ${FUND_BY[fid].name} is now ${t1}.`); }
function repChg(d,why){ const v=G.rep; G.rep=clamp(v+d,0,100); if(why) addLog(`Founder reputation ${d>0?'+':''}${d}: ${why}`,d>0?'good':'bad');
  if(REP_TIER(v)!==REP_TIER(G.rep)) rec(null,d>0?'good':'bad',`Among founders, your reputation is now: ${REP_TIER(G.rep)}.`); }
function passDeal(cid,referTo){
  const c=byId(cid); if(!c||c.owned) return;
  c.pitch='passed';
  if(c.calls>=2) repChg(-2,`${c.founder} spent ${c.calls} calls with you and got a pass.`);
  if(referTo&&FUND_BY[referTo]){ c.referredTo=referTo; relChg(referTo,5,`you referred ${c.name} to them.`); }
}
function loseDeal(cid){ const c=byId(cid); if(!c||c.owned) return; c.pitch='lost'; addLog(`${c.name} signed with ${c.lead?FUND_BY[c.lead].name:'another fund'} before you committed.`,'bad'); }
function coffee(fid){ if(G.hours<1||G.coffee[fid]) return; G.hours-=1; G.coffee[fid]=1; relChg(fid,4,'coffee and deal talk.'); }

function genCompany(rng,boost=0){
  const r=rng||G.dealRng, g=()=>gauss(r);
  const id=G.nextId++;
  // Every draw happens in a fixed order so the same seed always yields the same deal.
  const sRoll=r(), sPick=r(), stRoll=r(), q=g()+boost;
  const F={}; FKEYS.forEach(k=>F[k]=clamp(5.5+1.5*(0.65*q+0.75*g()),1,10));
  const fl={messy:r()<0.15, inflated:r()<0.18, concentration:r()<0.15, tension:r()<0.12, burnHeavy:r()<0.18};
  const rArr=g(),rGrowth=g(),rNrr=g(),rGm=r(),rBurn=g(),rRun=r(),rLoi=g(),rConc=r(),rCap=g(),rSafe=r(),rPool=r();
  const rFirst=r(),rLast=r(),rBg=r(),rN1=r(),rN2=r(),rOne=r(),rVal=g(),rRound=r(),rInt=g(),rRaise=r();
  const Rn=FKEYS.map(()=>g());
  const cSeed=Math.floor(r()*4294967296);

  const sector=(G.thesis!=='Generalist'&&sRoll<0.45)?G.thesis:pick(SECTORS,sPick);
  const stage=stRoll<0.3?0:stRoll<0.8?1:2;
  if(stage===0) fl.concentration=false;
  const [model,gmLo,gmHi]=MODELS[sector];

  const arr=[60e3,600e3,3e6][stage]*Math.exp((F.revenue-5.5)/2.2+0.35*rArr);
  const growth=clamp([120,85,60][stage]+28*(F.traction-5.5)+28*rGrowth,-10,450);
  const nrr=clamp(100+5*(F.traction-5.5)+7*rNrr,70,165);
  const gm=gmLo+(gmHi-gmLo)*rGm;
  const burn=[70e3,220e3,650e3][stage]*Math.exp(0.25*rBurn)*(fl.burnHeavy?1.9:1);
  const runwayMo=Math.round(5+rRun*16);
  const lois=Math.max(0,Math.round(1.5+0.8*(F.traction-5.5)+0.6*(F.market-5.5)+1.2*rLoi));
  const conc=fl.concentration?52+rConc*25:12+rConc*25;
  const capFounders=clamp([88,72,58][stage]-(fl.messy?22:0)+4*rCap,20,95);
  const safe=fl.messy?15+rSafe*15:rSafe*6;
  const pool=8+rPool*8;

  // Founders pitch their own numbers. Reported factors carry noise, and inflaters pad traction.
  const sd0=(sector===G.thesis)?1.0:1.6;
  const R={}, sd={};
  FKEYS.forEach((k,i)=>{ R[k]=clamp(F[k]+sd0*0.8*Rn[i]+(fl.inflated&&(k==='traction'||k==='revenue')?1.3:0),1,10); sd[k]=sd0; });
  const deckArr=arr*(fl.inflated?1.45+0.3*rSafe:1);
  const deckGrowth=growth*(fl.inflated?1.35:1);

  // True quality: what actually drives outcomes. Hidden from the player.
  const z=k=>(F[k]-5.5)/1.5;
  let s=(0.25*z('team')+0.2*z('traction')+0.1*z('revenue')+0.15*z('tech')+0.2*z('market')+0.1*z('fmf'))/0.72;
  s-=fl.messy*0.45+fl.inflated*0.5+fl.concentration*0.4+fl.tension*0.6+fl.burnHeavy*0.35;

  // Price follows the pitch and the market, not the truth.
  const rq=FKEYS.reduce((a,k)=>a+(R[k]-5.5)/1.5,0)/FKEYS.length;
  const RG=REGIMES[G.regime];
  const post=[9e6,18e6,55e6][stage]*Math.exp(0.25*rq+0.18*rVal)*RG.val*Math.max(0.6,1-0.035*(G.rate-3));
  const round=post*(0.18+0.06*rRound);
  const interest=sig(0.7*s+0.6*rq+RG.hype+0.6*rInt);

  let name=pick(NA,rN1)+pick(NB,rN2); name=name[0].toUpperCase()+name.slice(1);
  if(G.usedNames[name]){G.usedNames[name]++; name+=' '+['Labs','AI','HQ','Systems'][G.usedNames[name]%4];} else G.usedNames[name]=1;
  const tier=F.team>=7.2?'high':F.team>=4.8?'mid':'low';

  return {
    id, name, sector, model, stage, entryStage:stage, F, R, sd, flags:fl, s,
    metrics:{arr,growth,nrr,gm,burn,runwayMo,cash:burn*runwayMo,lois,conc,capFounders,safe,pool},
    deck:{arr:deckArr,growth:deckGrowth},
    post, entryPost:post, round, raised:[0.5e6,2e6,8e6][stage]+round, interest,
    founder:pick(FIRST,rFirst)+' '+pick(LAST,rLast), bg:pick(BG[tier],rBg), oneLiner:pick(ONELINERS[sector],rOne),
    facts:{}, flagsSeen:[], asked:[], calls:0, transcript:[],
    status:'deal', m:0.5*s, prevM:0.5*s, toRaise:6+Math.floor(rRaise*3), burn,
    owned:false, own:0, invested:0, returned:0, hOwn:1e6/post, hReturned:0,
    crisis:null, supQ:0, prep:0, supDone:{}, bridges:0, story:[], bridgeDecision:null, entryQ:G.q,
    rng:mulberry32(cSeed^hashStr(G.seed)),
  };
}

// ---------------------------------------------------------------------------
// Diligence
// ---------------------------------------------------------------------------
function tight(c,k,v){c.sd[k]=Math.min(c.sd[k],v)}
function answer(c,key){
  const M=c.metrics,F=c.F,f=c.flags; let quote='',fact=null,flag=null,level='bad';
  const $=fmt$;
  switch(key){
    case 'burn': quote=`We burn about ${$(M.burn)} a month.${f.burnHeavy?' We hired ahead of the round, so it is running above plan.':''}`;
      fact=['Monthly burn',$(M.burn)]; if(f.burnHeavy) flag='Burn is roughly double the norm for this stage.'; break;
    case 'arr': quote=M.arr<80e3?`We are early. Run rate is about ${$(M.arr)}, mostly from paid pilots.`:`Run rate is ${$(M.arr)} in annual recurring revenue.`;
      fact=['Verified ARR',$(M.arr)]; tight(c,'revenue',0.4);
      if(f.inflated) flag=`The deck said ${$(c.deck.arr)}. The gap is signed contracts that are not live yet.`; break;
    case 'growth': quote=`We grew ${Math.round(M.growth)}% over the last twelve months.`;
      fact=['Revenue growth',`${Math.round(M.growth)}% YoY`]; tight(c,'traction',0.7);
      if(f.inflated && !c.asked.includes('arr')) flag=`The deck showed ${Math.round(c.deck.growth)}% by starting from a slow month.`; break;
    case 'cash': quote=`We have ${$(M.cash)} in the bank. That is about ${M.runwayMo} months of runway.`;
      fact=['Cash and runway',`${$(M.cash)} · ${M.runwayMo} mo`];
      if(M.runwayMo<8){flag='Under 8 months of runway. They need this round to close, which gives you leverage on terms but means little margin for error.';level='warn'} break;
    case 'lois': quote=M.lois===0?'No signed LOIs yet. We have conversations going.':`We have ${M.lois} signed LOI${M.lois>1?'s':''} and a few more in legal review.`;
      fact=['Signed LOIs',String(M.lois)]; tight(c,'market',1.0); tight(c,'traction',1.0); break;
    case 'interest': {

      fact=['Investor demand',lvl];

      fact=['Founders / pool / SAFEs',`${Math.round(M.capFounders)}% / ${Math.round(M.pool)}% / ${Math.round(M.safe)}%`];
      if(f.messy) flag='Messy cap table. Founders are under-owned for this stage and the SAFE overhang will spook later investors.'; break;

      quote+=F.fmf>=7?' They lived this problem in a past job.':F.fmf<4.5?' Nobody could say why they picked this market.':'';

      fact=['Technical moat',t>=8?'Deep':t>=6?'Moderate':t>=4?'Thin':'None']; tight(c,'tech',0.4); break; }

      fact=['Market sizing',t>=8?'$10B+':t>=6?'$2–5B':t>=4?'<$1B':'Niche']; tight(c,'market',0.4); break; }

function runCall(cid,keys){

  if(c.lastMove.to>c.lastMove.from) teach('clock',{name:c.name,from:capBefore,to:c.lastMove.to});

// Investing and follow-ons

function checkOptions(c){
  const base=[[250e3,500e3,1e6],[500e3,1e6,2e6],[1.5e6,3e6,5e6]][c.stage];
  const labels=['Participate','Co-lead','Lead'];
  const block=hotRound(c)&&!hasAccess(c);
  return base.map((amt,i)=>({amt,label:labels[i],ok:amt<=G.cash&&amt<=c.round*0.75&&!(block&&i===2),hotBlock:block&&i===2}));
}
function invest(cid,amt){
  const c=byId(cid); if(!c||amt>G.cash) return;
  const price=(c.terms&&capNow(c))||c.post;
  c.owned=true; c.entryQ=G.q; c.initial=(c.initial||0)+amt; c.entryCap=price; c.firstCap=c.terms?c.terms.tr[0].cap:c.post; deploy(c,amt,price);
  addLog(`Invested ${fmt$(amt)} in ${c.name} (${STAGES[c.stage]}) at a ${fmt$(price)} post-money cap for ${pct(amt/price)}.`,'good');
  if(c.lead) relChg(c.lead,6,`co-invested in ${c.name}.`);
  repChg(1);
  teach('thesis',{name:c.name,sector:c.sector,thesis:G.thesis,inThesis:c.sector===G.thesis});
}
function decide(pid,choice){
  const i=G.pending.findIndex(p=>p.pid===pid); if(i<0) return; const p=G.pending[i]; const c=byId(p.cid);
  if(p.type==='prorata'){
    if(choice==='pass') passProRata(c,p);

      deploy(c,amt);
      addLog(`Followed on in ${c.name}'s ${STAGES[c.stage]}: ${fmt$(amt)} at ${fmt$(c.post)} post.`,'good');
      if(c.lead&&choice==='full') relChg(c.lead,3,`took your full pro-rata in ${c.name} alongside them.`); } }
  } else if(p.type==='offer'){
    if(choice==='accept'){ doExit(c,p.val,'Acquisition'); repChg(1); }
    else { c.heldOffers=(c.heldOffers||0)+1; c.story.push({k:'held',val:p.val});
      // Turning a buyer away costs momentum: a distracted team, a buyer who may not come back.
      c.m-=p.founderSells?CAL.holdSells:CAL.holdKeen;
      repChg(p.founderSells?-3:-1,p.founderSells?`you pushed ${c.founder} to turn down a sale they wanted.`:null);
      addLog(`You pushed ${c.name}'s board to turn down ${fmt$(p.val)}.`,'warn'); }
  } else {
    if(choice==='accept'){ const amt=Math.min(G.cash,p.amount);
      deploy(c,amt); c.raised+=p.total; c.bridgeDecision='accepted';
      addLog(`Funded ${fmt$(amt)} of a ${fmt$(p.total)} bridge for ${c.name}.`,'warn');
      repChg(3,`you stood behind ${c.name} in a bridge.`); if(c.lead) relChg(c.lead,4,`you split the ${c.name} bridge with them.`);
    } else { c.bridgeDecision='declined'; addLog(`Declined the bridge for ${c.name}.`,'bad');
      repChg(-4,`you declined ${c.name}'s bridge.`); if(c.lead) relChg(c.lead,-6,`you left them carrying the ${c.name} bridge.`); }
  }
  G.pending.splice(i,1);
}
function passProRata(c,p){
  if(p.ownPre>=0.08){ c.m-=0.2; addLog(`Passed on pro-rata in ${c.name}. As a major holder, sitting out sent a negative signal to other investors.`,'bad');
    repChg(-2); if(c.lead) relChg(c.lead,-4,`you sat out ${c.name}'s round as a major holder.`); }
  else addLog(`Passed on pro-rata in ${c.name}.`,'info');
}
function doSupport(cid,key){
  const c=byId(cid), S=SUPPORT[key]; if(!c||c.supDone[key]||G.hours<S.hours||c.status!=='alive') return;
  G.hours-=S.hours; c.supDone[key]=true;
  const mult=c.sector===G.thesis?1.3:1;
  if(key==='recruit') c.supQ+=0.12*mult;
  if(key==='intros') c.supQ+=(0.12+(c.F.traction<5?0.08:0))*mult;
  if(key==='prep') c.prep=Math.min(1,c.prep+0.5*mult);
  if(key==='board') c.supQ+=0.05*mult;
  repChg(1);
  if(c.crisis&&c.crisis.fix===key){ repChg(2,`you helped ${c.name} through a ${c.crisis.short.toLowerCase()}.`); c.story.push({k:'fixed',short:c.crisis.short}); c.crisis=null; c.supQ+=0.08; addLog(`${c.name}: your ${S.label.toLowerCase()} resolved the problem.`,'good'); }
}

// ---------------------------------------------------------------------------
// Payouts and marks. Preferred stock: 1x non-participating, pari passu.
// ---------------------------------------------------------------------------
function payout(own,inv,val,raised){ return val>=raised?Math.max(own*val,Math.min(inv,val)):val*inv/raised; }
function haircut(c){ return c.status==='bridge'?0.25:c.m<-1?0.4:c.m<-0.3?0.75:1; }
function navOf(c){
  // A check wired this quarter is held at cost until the quarter ends.
  if(c.status==='deal'&&c.owned) return c.invested;
  return (c.status==='alive'||c.status==='bridge')?c.own*c.post*haircut(c):0;
}
function valueOf(c){ return c.status==='exited'?c.returned:navOf(c); }
function doExit(c,val,kind){
  c.status='exited'; c.exitVal=val; c.exitKind=kind; c.exitQ=G.q;
  c.hReturned=payout(c.hOwn,1e6,val,c.raised);
  if(!c.owned&&(c.pitch==='passed'||c.pitch==='lost')&&c.hReturned>=5e6)
    G.events.push({t:'miss',cid:c.id,q:G.q,kind,val,x:c.hReturned/1e6,lost:c.pitch==='lost',refTo:c.referredTo});
  if(c.owned){ c.returned=payout(c.own,c.invested,val,c.raised);
    if(val<c.raised&&c.returned>c.own*val*1.05) teach('pref',{name:c.name,val,raised:c.raised,got:c.returned,common:c.own*val,inv:c.invested}); G.distributed+=c.returned; G.flows.push({q:G.q+1,amt:c.returned}); distribute(c);
    G.events.push({t:'exit',cid:c.id,q:G.q,kind,val,ret:c.returned,inv:c.invested,carry:c.carry||0,lpNet:c.lpNet||0,
      pref:val<c.raised, common:c.own*val, raised:c.raised, why:storyLine(c,'exit')});
    rec(c,c.returned>=c.invested?'good':'bad',`${c.name}: ${kind==='IPO'?'went public':kind==='Soft landing'?'sold for parts':'acquired'} at ${fmt$(val)}. You returned ${fmt$(c.returned)} on ${fmt$(c.invested)} (${fmtX(c.returned/c.invested)}).`); }
}
// One-line story of why a company ended the way it did, built from its actual history.
function storyLine(c,end){
  const S=c.story, ups=S.filter(e=>e.k==='up'), downs=S.filter(e=>e.k==='down').length, bridges=S.filter(e=>e.k==='bridge').length;
  const crisis=[...S].reverse().find(e=>e.k==='crisis'), noraise=[...S].reverse().find(e=>e.k==='noraise');
  const best=ups.reduce((a,e)=>Math.max(a,e.step),0), mkt=REGIMES[G.regime].label.toLowerCase();
  const n=k=>k===1?'one':k===2?'two':k===3?'three':String(k);
  if(end==='dead'){
    if(crisis&&!S.some(e=>e.k==='fixed'&&e.short===crisis.short)) return `${({'Cofounder conflict':'The fight between the cofounders','Lost top customer':'Losing its biggest customer','Key hire poached':'Losing its VP of Engineering'})[crisis.short]||'A crisis'} never got addressed. Momentum slid, the next round never came together, and the money ran out.`;
    if(noraise&&(noraise.regime==='correction'||noraise.regime==='recession')) return `It tried to raise ${noraise.regime==='recession'?'in the middle of a recession':'during a market correction'}. Investors had pulled back, ${bridges?'the bridge only bought a few months, ':''}and the company wound down.`;
    if(S.some(e=>e.k==='bridgeFail'&&e.funded)) return 'Insiders funded a bridge to buy nine more months. The milestones never came, and neither did a buyer.';
    return 'Growth never reached the bar for the next round. With no new investors and no buyer, the founders shut it down.';
  }
  const x=c.returned/c.invested;
  if(c.exitKind==='Soft landing') return `${bridges?'After '+n(bridges)+' bridge'+(bridges>1?'s':'')+', the':'The'} company ran short of cash and sold its team and technology to a competitor for less than it had raised.`;
  if(c.exitKind==='IPO') return `${ups.length?`${n(ups.length)[0].toUpperCase()+n(ups.length).slice(1)} up round${ups.length>1?'s':''}${best>=2?`, including a ${best.toFixed(1)}x step-up,`:''} carried it to the ${STAGES[c.stage]}`:'It compounded quietly'}, and the IPO window was open in a ${mkt} market.`;
  if(x>=10) return `A breakout. ${best>=2?`A ${best.toFixed(1)}x step-up told everyone what it was becoming, and a`:'A'} strategic buyer paid a premium to own the category.`;
  if(x>=3) return `${downs||bridges?'It got through a rough patch and':'Steady execution'}${ups.length?` across ${n(ups.length)} up round${ups.length>1?'s':''}`:''} made it an obvious target for a larger competitor.`;
  if(x>=1) return downs||bridges?`It survived ${downs?'a down round':'a bridge'} but never broke out. A buyer picked it up for its customers and engineers.`:`Revenue kept growing, but never fast enough to stand out. An acquirer bought it for the customer base.`;
  return `It sold for less than the ${fmt$(c.raised)} investors had put in.${c.exitVal<c.raised?' Preferred stock meant investors were paid back before common, so you recovered part of your money.':''}`;
}
function kill(c){ c.status='dead'; c.exitQ=G.q;
  if(c.referredTo) relChg(c.referredTo,-4,`${c.name}, which you referred, shut down.`);
  if(c.owned){ G.events.push({t:'dead',cid:c.id,q:G.q,inv:c.invested,why:storyLine(c,'dead')});
    teach('powerlaw',{name:c.name,inv:c.invested,owned:G.companies.filter(x=>x.owned).length}); }
  if(c.owned) rec(c,'bad',`${c.name} shut down. ${fmt$(c.invested)} written off.`); }

// ---------------------------------------------------------------------------
// Turn engine
// ---------------------------------------------------------------------------
function nextRegime(cur,roll){
  const ci=ORDER.indexOf(cur), f=G.D.down*(1+Math.max(0,G.rate-3.5)*0.35);
  const P={}; let sum=0;
  ORDER.forEach((k,ki)=>{ if(k===cur) return; const p=TRANS[cur][k]*(ki>ci?f:1/f); P[k]=p; sum+=p; });
  if(sum>0.6){ for(const k in P) P[k]*=0.6/sum; sum=0.6; }
  P[cur]=1-sum; let acc=0;
  for(const k of ORDER){ acc+=P[k]; if(roll<acc) return k; } return cur;
}
function stepMarket(){
  const r=G.marketRng; const rr=r(),rn=gauss(r),sr=r(),ss=r(),sg=r();
  const prev=G.regime; G.regime=nextRegime(G.regime,rr);
  const drift={boom:0.06,normal:0,correction:-0.12,recession:-0.32}[G.regime]+(G.D.shock&&G.q<8?0.5:0);
  G.rate=clamp(G.rate+drift+0.15*rn+0.03*(3-G.rate),0,8);
  if(G.regime!==prev) rec(null,ORDER.indexOf(G.regime)>ORDER.indexOf(prev)?'bad':'good',`The market moved from ${REGIMES[prev].label} to ${REGIMES[G.regime].label}.`);
  if(G.q%4===3 && sr<0.65){
    const sector=pick(SECTORS,ss), up=sg>=0.5;
    G.shocks.push({sector,mag:up?0.12:-0.12,from:G.q+1,until:G.q+5,text:SHOCKS[sector][up?0:1]});
    rec(null,up?'good':'bad',`Sector news: ${SHOCKS[sector][up?0:1]}.`);
  }
}
function stepCompany(c){
  const r=c.rng;
  // Fixed draw count per quarter keeps outcomes reproducible regardless of choices.
  const n=gauss(r),raiseRoll=r(),stepN=gauss(r),exitRoll=r(),exitN=gauss(r),evRoll=r(),evType=r(),deathRoll=r(),timing=r();
  const RG=REGIMES[G.regime];
  if(c.status==='bridge'){
    // Bridge money buys time, not survival. Odds depend on momentum and how many bridges came before.
    let pOk=sig(CAL.brA+CAL.brM*c.m-CAL.brN*c.bridges);
    if(c.owned&&c.bridgeDecision!=='accepted') pOk*=CAL.brDecl;
    const ok=deathRoll<pOk, funded=c.owned&&c.bridgeDecision==='accepted';
    c.bridgeDecision=null;
    if(!ok) c.story.push({k:'bridgeFail',funded});
    if(!ok&&funded) rec(c,'bad',`${c.name} burned through the bridge without hitting its milestones.`);
    if(ok){ c.status='alive'; c.toRaise=3; c.m=Math.max(c.m,-0.6)+0.4; c.bridges++; c.story.push({k:'bridge'}); rec(c,'warn',`${c.name} closed its bridge and has about nine months to hit milestones.`); }

    return;
  }
  if(c.crisis){ if(c.owned) repChg(-3,`${c.name}'s ${c.crisis.short.toLowerCase()} went unanswered.`); c.story.push({k:'crisis',short:c.crisis.short}); c.m-=c.owned?c.crisis.pen:c.crisis.pen*0.5; rec(c,'bad',`${c.name}: the ${c.crisis.short.toLowerCase()} went unaddressed and momentum took a hit.`); c.crisis=null; }
  const shock=G.shocks.filter(s=>s.sector===c.sector&&s.from<=G.q&&G.q<s.until).reduce((a,s)=>a+s.mag,0);
  c.prevM=c.m;
  c.m=clamp(0.9*c.m+0.1*c.s+RG.mom+shock+0.3*n+c.supQ,-3,3);
  c.supQ=0;
  if(evRoll<0.09){
    let acc=0, ev=EVENTS[EVENTS.length-1]; for(const e of EVENTS){acc+=e.w; if(evType<acc){ev=e;break;}}
    if(ev.crisis){ c.crisis={...ev,q:G.q}; rec(c,'warn',`${c.name} needs help: ${ev.text}`); }
    else { c.m+=ev.boost; rec(c,'good',`${c.name}: ${ev.text}`); }
  }
  const pExit=c.stage>=3?Math.min(0.14,0.025+0.025*(c.stage-3))*RG.exit*(c.m>0.3?1:0.3):CAL.earlyExit*RG.exit*(c.m>0?1:0.4);
  if(exitRoll<pExit){
    const val=c.post*Math.exp(CAL.exitBase+CAL.exitM*c.m+0.3*exitN);
    const kind=(val>=1e9&&c.stage>=4&&(G.regime==='boom'||G.regime==='normal'))?'IPO':'Acquisition';
    if(c.owned&&kind==='Acquisition'){
      const x=payout(c.own,c.invested,val,c.raised)/c.invested, founderSells=c.m<0.9||c.heldOffers>0;
      G.pending.push({pid:'o'+c.id+'_'+G.q,type:'offer',cid:c.id,val,x,founderSells});
      teach('offer',{name:c.name,val,x});
      rec(c,'good',`${c.name} has an acquisition offer at ${fmt$(val)}. Your call on the board is waiting.`); return;
    }

    const p=sig(CAL.raiseBase+1.1*c.m+RG.raise+c.prep+(c.flags.messy?-0.4:0)+(c.owned&&G.rel.copperline>=60&&c.stage>=2?0.35:0));
    c.prep=0;
    if(raiseRoll<p){
      const step=clamp(Math.exp(CAL.stepBase+CAL.stepM*c.m+RG.step+0.3*stepN),0.5,4.5);
      const ownPre=c.own, pre=c.post*step, round=pre*0.25;

      c.own*=0.8; c.hOwn*=0.8; c.burn*=1.6;
      c.toRaise=5+Math.floor(timing*3);
      c.story.push({k:step<1?'down':'up',step,stage:c.stage});
      if(c.referredTo&&step>=1.5&&!c.refPaid){ c.refPaid=1; relChg(c.referredTo,6,`${c.name}, which you referred, raised at a ${step.toFixed(1)}x step-up.`); }
      if(c.owned){
        G.pending.push({pid:'p'+c.id+'_'+G.q,type:'prorata',cid:c.id,amount:ownPre*round,ownPre,step,round});
        teach('prorata',{name:c.name,ownPre,ownPost:c.own,amount:ownPre*round,step});
        if(step>=1.5) teach('markup',{name:c.name,step});
        rec(c,step>=1?'good':'warn',`${c.name} raised a ${STAGES[c.stage]} at ${fmt$(c.post)} post${step<1?' (a down round)':` (${step.toFixed(1)}x step-up)`}. Pro-rata decision waiting.`);
      }
    } else {
      c.status='bridge'; c.story.push({k:'noraise',regime:G.regime});
      if(c.owned){ const total=c.burn*6, ask=total*clamp(c.own*4,0.3,1);
        G.pending.push({pid:'b'+c.id+'_'+G.q,type:'bridge',cid:c.id,amount:ask,total});
        teach('bridge',{name:c.name,ask,invested:c.invested});
        rec(c,'bad',`${c.name} could not close its next round and is asking insiders for a bridge.`); }

}
function endQuarter(reset=true){

  for(const p of [...G.pending]) decide(p.pid,p.type==='prorata'?'pass':p.type==='offer'?'accept':'decline');
  for(const id of G.deals){ const c=byId(id); if(c.status==='deal'){ c.status='alive'; c.passed=!c.owned; } }
  G.deals=[];
  stepMarket();
  for(const c of G.companies) if(c.status==='alive'||c.status==='bridge') stepCompany(c);
  G.q++; G.rateHist.push(G.rate); G.regimeHist.push(G.regime);
  snapshot();
  if(G.q>=TOTAL_QS){ finish(); return; }
  chargeFee();
  G.hours=G.D.hours; G.companies.forEach(c=>c.supDone={}); G.coffee={};
  // Relationships need upkeep: anything above a fund's starting point fades a little each quarter.
  FUNDS.forEach(f=>{ if(G.rel[f.id]>f.start) G.rel[f.id]-=1; });
  if(G.q<INVEST_QS){ genDeals(); requeueWaiting(); }
  if(G.q===20){ const o=G.companies.filter(c=>c.owned); teach('lifecycle',{owned:o.length,dead:o.filter(c=>c.status==='dead'||c.exitKind==='Soft landing').length,big:o.filter(c=>c.status==='exited'&&c.returned>=3*c.invested).length}); }
  if(G.q===INVEST_QS) teach('jcurve',{net:G.lp.dist-G.lp.called-G.lp.fees,fees:G.lp.fees});
  if(G.q===INVEST_QS) rec(null,'info','The investment period is over. No new deals from here on: manage reserves, follow-ons and founder support until year 10.');
}
// One point per quarter for the J-curve: LP cumulative net cash flow and net TVPI at that point.
function snapshot(){
  const S=settle();
  G.hist.push({q:G.q, net:G.lp.dist-G.lp.called-G.lp.fees, tvpi:S.tvpi, dpi:S.dpi});
}
function needsAttention(){ return G.pending.length>0 || G.companies.some(c=>c.owned&&c.status==='alive'&&c.crisis); }
function skipAhead(){
  G.recap=[]; G.events=[]; let n=0;
  do { endQuarter(false); n++; } while(!G.over && !needsAttention() && G.q>=INVEST_QS && n<40);
}

// ---------------------------------------------------------------------------
// Scoring
// ---------------------------------------------------------------------------
function irr(flows){
  const by={}; flows.forEach(f=>by[f.q]=(by[f.q]||0)+f.amt);
  const ent=Object.entries(by).map(([q,v])=>[+q,v]);
  const npv=r=>ent.reduce((a,[q,v])=>a+v/Math.pow(1+r,q),0);
  let lo=-0.6,hi=1.0; if(npv(lo)*npv(hi)>0) return null;
  for(let i=0;i<120;i++){const mid=(lo+hi)/2; if(npv(lo)*npv(mid)<=0) hi=mid; else lo=mid;}
  return Math.pow(1+(lo+hi)/2,4)-1;
}
function netIrrLive(){ const S=settle(); return irr([...G.lpFlows,{q:G.q,amt:S.clawback+S.lpNav-S.accrued}]); }
function liveStats(){
  const owned=G.companies.filter(c=>c.owned);
  const invested=owned.reduce((a,c)=>a+c.invested,0);
  const nav=owned.reduce((a,c)=>a+navOf(c),0);
  return {invested,nav,moic:invested>0?(G.distributed+nav)/invested:0};
}
function finish(){
  G.over=true;
  const owned=G.companies.filter(c=>c.owned);
  const L=liveStats();
  const flows=[...G.flows,{q:TOTAL_QS,amt:L.nav}];
  const S=settle();
  const lpFinal=[...G.lpFlows,{q:TOTAL_QS,amt:S.clawback+S.lpNav-S.accrued}];
  const paidIn=S.paidIn;
  const hv=c=>c.status==='exited'?c.hReturned:(c.status==='alive'||c.status==='bridge')?c.hOwn*c.post*haircut(c):0;
  const all=G.companies;
  const indexM=all.reduce((a,c)=>a+hv(c),0)/(all.length*1e6);
  const picksM=owned.length?owned.reduce((a,c)=>a+hv(c),0)/(owned.length*1e6):0;
  const misses=all.filter(c=>!c.owned).map(c=>({c,x:hv(c)/1e6})).sort((a,b)=>b.x-a.x).slice(0,3);
  const gpCommitValue=G.gp.dist+S.nav*G.gpShare;
  G.result={...L,dist:G.distributed,paidIn,S,tvpi:S.tvpi,dpi:(G.lp.dist+S.clawback)/paidIn,irr:irr(flows),netIrr:irr(lpFinal),
    fees:G.lp.fees,carry:S.entitled,carryPaid:G.gp.carry,clawback:S.clawback,lpDist:G.lp.dist,
    gpCommit:G.gpCommit,gpCommitValue,gpKept:G.gpKept,
    grossLp:G.lp.dist+G.gp.carry+S.lpNav,
    indexM,picksM,misses,undeployed:G.cash,dealsSeen:all.length,called:all.filter(c=>c.calls>0).length,
    calledInvested:owned.filter(c=>c.calls>0).length,owned:owned.length};
}

// Formatting helpers (shared by engine and UI)
function fmt$(x){const a=Math.abs(x),s=x<0?'-':'';if(a>=1e9)return s+'$'+(a/1e9).toFixed(a>=1e10?1:2)+'B';if(a>=1e6)return s+'$'+(a/1e6).toFixed(a>=1e8?0:1)+'M';if(a>=1e3)return s+'$'+Math.round(a/1e3)+'K';return s+'$'+Math.round(a)}
function fmtX(x){return (x>=10?x.toFixed(0):x.toFixed(2))+'x'}
function pct(x,d=1){return (x*100).toFixed(d)+'%'}
// ENGINE END
</script>

// Deal card: four plain sections (round, team, traction, metrics). Numbers the founder hasn't

const INLINE_FACTS=['arr','growth','lois','nrr','burn','cash','gm','refs','interest'];
// The round's price schedule as a strip of weeks: each tranche's cap, where the clock is, and when it closes.
function termsLadder(c){
  const T=c.terms, cw=Math.min(closeWeek(c),QUARTER_WEEKS), held=heldPrice(c), closed=roundClosed(c);
  let prev=0; const segs=[];
  for(const t of T.tr){ if(prev>=cw) break; const end=Math.min(t.until,cw); segs.push({from:prev,to:end,cap:held?T.tr[0].cap:t.cap}); prev=end; }
  const W=w=>(w/QUARTER_WEEKS*100).toFixed(2)+'%';
  const now=Math.min(c.week,QUARTER_WEEKS), cur=capNow(c), next=T.tr.find(t=>c.week<t.until&&t.cap>cur);
  const line=closed?`The round closed at week ${closeWeek(c)}.`
    :c.negCap?`You negotiated a ${fmt$(c.negCap)} cap. It holds until the round closes.`
    :held?`Your relationship with ${FUND_BY[c.lead]?FUND_BY[c.lead].short:'the lead'} holds your allocation at the first-close cap until week ${closeWeek(c)}.`
    :next?`Week ${c.week}. The cap is ${fmt$(cur)} now and rises to ${fmt$(next.cap)} at week ${Math.min(...T.tr.filter(t=>c.week<t.until).map(t=>t.until))}.${closeWeek(c)!==Infinity?` Closes at week ${closeWeek(c)}.`:''}`
    :`Week ${c.week}. The cap is ${fmt$(cur)}${closeWeek(c)===Infinity?' and the round has no deadline yet.':`, and the round closes at week ${closeWeek(c)}.`}`;
  const moves=c.pitch||closed?'':[
    !c.lead&&!c.negotiated?`<button class="small" data-act="openNeg" data-id="${c.id}">Propose a lower cap</button>`:'',
    T.heat==='cold'&&!c.waited?`<button class="small" data-act="waitDeal" data-id="${c.id}" title="Leave the round open. Next quarter it may come back cheaper, or fill without you if the company improves.">Wait for a better price</button>`:'',
    c.negotiated&&!c.negCap?'<span class="muted" style="font-size:.8rem">The founder turned down your lower cap.</span>':''].join('');
  return `<div class="ladder ${T.heat}"><div class="lad-bar">${segs.map(g=>`<span class="lad-seg" style="left:${W(g.from)};width:${W(g.to-g.from)}"><b>${fmt$(g.cap)}</b></span>`).join('')}
      ${cw<QUARTER_WEEKS?`<span class="lad-closed" style="left:${W(cw)};width:${W(QUARTER_WEEKS-cw)}">closed</span>`:''}
      <i class="lad-now" style="left:${W(now)}"></i></div>
    <div class="lad-axis"><span>week 0</span><span>${QUARTER_WEEKS}</span></div>
    <p class="lad-line">${line}</p>${moves?`<div class="lad-moves">${moves}</div>`:''}</div>`;
}
function dealBody(c){

  const row=(label,val,tip='')=>`<div${tip?` title="${esc(tip)}"`:''}><dt>${label}</dt><dd>${val}</dd></div>`;
